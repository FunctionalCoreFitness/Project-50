        <div class="eyebrow">Episode Dashboard · ${fiftyStr.slice(0,4)} build</div>
        <h2>Where I Stand Today</h2>
        <div class="ex-grid">
          ${exItems.map(e=>`<div class="ex-item${e.k==='Race Target'?' wide':''}"><div class="k">${e.k}</div><div class="v">${e.v??'—'}${e.u?` <small>${e.u}</small>`:''}</div></div>`).join('')}
        </div>
      </div>
    </section>`;

  // count statuses across a set of metrics for the status meter
  function sectionStatus(metrics, isLabs){
    let green=0, amber=0, red=0, untested=0;
    for(const m of metrics){
      // Reference metrics are shown for context and never scored - they would
      // otherwise sit permanently "untested" and read as a failure to track
      // something that was never asked of him.
      if(m.watch) continue;
      if(m.value===null||m.value===undefined){ untested++; continue; }
      if(isLabs){
        if(m.flag==='out') red++; else green++;
        continue;
      }
      const ev=evaluate(m);
      if(ev.status==='green') green++;
      else if(ev.status==='amber') amber++;
      else if(ev.status==='red') red++;
      // A metric with no target is shown, not judged. Counting it green scored
      // it as a perfect result for hitting a mark that was never set - dietary
      // sodium alone was worth ~17 points of the Nutrition score that way.
      // Leave it out of the denominator entirely, as an untested metric is.
    }
    const tested=green+amber+red;
    return {green,amber,red,untested,tested};
  }

  // build a compact status meter (segmented bar + label)
  function statusMeter(s, opts={}){
    const total=s.tested||1;
    const gPct=s.green/total*100, aPct=s.amber/total*100, rPct=s.red/total*100;
    let label, lclass;
    if(s.tested===0){ label='Not yet tested'; lclass='st-none'; }
    else if(s.red>0){ label=`${s.red} need attention`; lclass='st-red'; }
    else if(s.amber>0){ label=`${s.amber} near target`; lclass='st-amber'; }
    else { label='All on track'; lclass='st-green'; }
    const seg = s.tested===0
      ? `<div class="meter-seg" style="width:100%;background:var(--track)"></div>`
      : `<div class="meter-seg" style="width:${gPct}%;background:var(--green)"></div>
         <div class="meter-seg" style="width:${aPct}%;background:var(--amber)"></div>
         <div class="meter-seg" style="width:${rPct}%;background:var(--red)"></div>`;
    return `<div class="status-meter ${opts.big?'big':''}">
      <div class="meter-bar">${seg}</div>
      <div class="meter-label ${lclass}">${label}</div>
    </div>`;
  }

  // category sections
  for(const c of d.categories){
    const isLabs = c.id==='labs';

    // Labs: show only out-of-range markers; goal is zero out of range
    let metricsToShow = c.metrics;
    let metaHtml = `${c.source}<br>${c.cadence}`;
    let labsNote = '';
    if(isLabs){
      const outList = c.metrics.filter(m=>m.flag==='out');
      const tested = c.metrics.filter(m=>m.value!==null && m.value!==undefined).length;
      metricsToShow = outList;
      const n = outList.length;
      const counterClass = n===0 ? 'goal-met' : 'goal-open';
      metaHtml = `${c.source}<br>
        <span class="labs-goal ${counterClass}">
          ${n===0 ? 'All markers in range ✓' : `${n} out of range · goal 0`}
        </span>`;
      labsNote = `<div class="labs-note"><b>Showing out-of-range markers only.</b> ${tested} markers tracked; the rest are in healthy range. Goal: zero out of range. Thyroid history on file: 7.7 cm right nodule, multinodular enlargement, cancer ruled out.</div>`;
    }

    const watchList = metricsToShow.filter(m=>m.watch);
    const mainList  = metricsToShow.filter(m=>!m.watch);
    const gridInner = mainList.length
      ? mainList.map(metricCard).join('')
      : `<div class="all-clear">Every tracked marker is in healthy range. Goal met.</div>`;
    const watchHtml = watchList.length ? `
      <div class="watch-head">Reference &mdash; not logged daily</div>
      <div class="watch-note">Your nutrition app doesn't report these, and four of the five are already in range. Kept for context; they don't count toward the score.</div>
      <div class="grid grid-watch">${watchList.map(metricCard).join('')}</div>` : '';

    const sStat = sectionStatus(c.metrics, isLabs);
    html += `
      <section id="${c.id}">
        <div class="sec-head">
          <div class="sec-title">${c.name}</div>
          <div class="sec-meta">${metaHtml}</div>
        </div>
        ${statusMeter(sStat)}
        ${labsNote}
        <div class="grid">
          ${gridInner}
        </div>
        ${watchHtml}
      </section>`;
  }
  // protocol section
  if(d.protocol){
    html += `
      <section id="protocol" class="protocol">
        <div class="sec-head">
          <div class="sec-title">Protocol &amp; Context</div>
          <div class="sec-meta">Reference<br>Tap to expand</div>
        </div>`;
    if(d.protocol.thyroid_history){
      html += `<div class="labs-note"><b>Thyroid history:</b> ${d.protocol.thyroid_history}</div>`;
    }
    for(const g of d.protocol.groups){
      const hasDesc = g.items.some(i=>typeof i==='object' && i.purpose);
      const itemsHtml = g.items.map(i=>{
        if(typeof i==='object' && i.purpose){
          return `<li class="supp-item"><button class="supp-toggle" type="button">${i.name}</button><div class="supp-desc">${i.purpose}</div></li>`;
        }
        const label = (typeof i==='object') ? i.name : i;
        return `<li>${label}</li>`;
      }).join('');
      html += `
        <details>
          <summary>${g.title}</summary>
          <div class="body">
            <ul class="${hasDesc?'supp-list':''}">${itemsHtml}</ul>
            ${g.note?`<div class="pnote">${g.note}</div>`:''}
          </div>
        </details>`;
    }
    html += `</section>`;
  }

  // overall health gauge across all categories
  let allG=0,allA=0,allR=0,allU=0;
  for(const c of d.categories){
    const s=sectionStatus(c.metrics, c.id==='labs');
    allG+=s.green; allA+=s.amber; allR+=s.red; allU+=s.untested;
  }
  const overall={green:allG,amber:allA,red:allR,untested:allU,tested:allG+allA+allR};
  const overallLabel = overall.red>0
    ? `${overall.red} marker${overall.red>1?'s':''} need attention`
    : overall.amber>0 ? `${overall.amber} near target` : 'All systems on track';
  const gaugeHtml = `
    <section id="health-gauge">
      <div class="gauge-card">
        <div class="gauge-head">
          <div class="gauge-title">Overall Status</div>
          <div class="gauge-counts">
            <span class="gc gc-g"><b>${overall.green}</b> on track</span>
            <span class="gc gc-a"><b>${overall.amber}</b> near</span>
            <span class="gc gc-r"><b>${overall.red}</b> attention</span>
            <span class="gc gc-n"><b>${overall.untested}</b> untested</span>
          </div>
        </div>
        ${statusMeter(overall,{big:true})}
      </div>
    </section>`;

  // ---- Project 50 Score: 0-100 per group ----
  function scoreFor(catIds){
    let g=0,a=0,r=0,t=0;
    for(const id of catIds){
      const c=d.categories.find(x=>x.id===id); if(!c) continue;
      const s=sectionStatus(c.metrics, id==='labs');
      g+=s.green; a+=s.amber; r+=s.red; t+=s.tested;
    }
    if(t===0) return {score:null, tested:0};
    const score=Math.round(((g*1 + a*0.6 + r*0.2)/t)*100);
    return {score, tested:t};
  }
  function scoreClass(sc){
    if(sc===null) return 'sc-none';
    if(sc>=80) return 'sc-green';
    if(sc>=60) return 'sc-amber';
    return 'sc-red';
  }
  // A daily group is scored off yesterday's sync, not a test taken months ago,
  // so "12 tracked" says less than the day it came from. Show the date instead,
  // and say plainly when it has gone stale rather than implying it is current.
  function dailySub(catIds, tested){
    // Count what arrived, not what scored. Sodium is tracked without a target,
    // so it is deliberately left out of the score - but it did sync, and
    // saying "5 of 12" when six landed misreports the sync, not the score.
    let landed=0, total=0, newest=null;
    for(const id of catIds){
      const c=d.categories.find(x=>x.id===id); if(!c) continue;
      for(const m of (c.metrics||[])){
        if(m.watch) continue;
        total++;
        if(m.value===null||m.value===undefined) continue;
        landed++;
        if(!m.date) continue;
        if(!newest || m.date>newest) newest=m.date;
      }
    }
    if(landed===0) return 'waiting on first sync';
    if(!newest) return `${landed} tracked`;
    const dt=new Date(newest+'T00:00:00');
    const days=Math.round((new Date(new Date().toDateString()) - dt)/86400000);
    const when = days<=0 ? 'today' : (days===1 ? 'yesterday' : `${days} days ago`);
    return `${landed} of ${total} · ${when}`;
  }
  let scoreCardsHtml='', scoreSum=0, scoreCount=0;
  for(const grp of (d.score_groups||[])){
    const {score,tested}=scoreFor(grp.categories);
    if(score!==null){ scoreSum+=score; scoreCount++; }
    const target=(grp.categories&&grp.categories[0])?grp.categories[0]:'';
    const sub = grp.daily ? dailySub(grp.categories, tested)
                          : (tested===0?'not yet tested':`${tested} tracked`);
    scoreCardsHtml += `
      <a class="score-card score-card-link ${scoreClass(score)}" href="#${target}">
        <div class="score-val">${score===null?'—':score}</div>
        <div class="score-name">${grp.name}</div>
        <div class="score-sub">${sub}</div>
      </a>`;
  }
  const project50 = scoreCount? Math.round(scoreSum/scoreCount) : null;
  const scoreBlockHtml = `
    <section id="p50-score">
      <div class="score-head">
        <div class="score-head-title">Project 50 Score</div>
        <div class="score-overall ${scoreClass(project50)}">${project50===null?'—':project50}<small>/100</small></div>
      </div>
      <div class="score-grid">${scoreCardsHtml}</div>
    </section>`;

  // ---- Current Focus ----
  const cf=d.current_focus;
  const focusHtml = cf ? `
    <section id="focus">
      <div class="focus-card">
        <div class="focus-tag">Current Focus · ${cf.month}${cf.pillar?` · ${cf.pillar}`:''}</div>
        <div class="focus-main">${cf.focus}</div>
        ${cf.why?`<div class="focus-why">${cf.why}</div>`:''}
      </div>
    </section>` : '';

  // ---- Wins ----
  const wins=d.wins||[];
  const winsHtml = wins.length ? `
    <section id="wins">
      <div class="sec-head"><div class="sec-title">Wins</div>
        <div class="sec-meta">${wins.filter(w=>w.achieved).length} of ${wins.length} unlocked</div></div>
      <div class="wins-grid">
        ${wins.map(w=>`
          <div class="win ${w.achieved?'won':'locked'}">
            <div class="win-ico">${w.achieved?'\u{1F3C6}':'○'}</div>
            <div class="win-body">
              <div class="win-label">${w.label}</div>
              <div class="win-sub">${w.achieved?(w.date||'Achieved'):'Goal'}</div>
            </div>
          </div>`).join('')}
      </div>
    </section>` : '';

  // ---- Locations / Sets ----
  const loc=d.locations;
  const locHtml = loc ? `
    <section id="locations">
      <div class="sec-head"><div class="sec-title">Sets</div>
        <div class="sec-meta">Nine zones · nine chapters</div></div>
      <div class="loc-intro">${loc.intro}</div>
      <div class="loc-grid">
        ${loc.sets.map(s=>`
          <div class="loc-card loc-${s.key}">
            <div class="loc-cardtop">
              <div class="loc-verb">${s.verb}</div>
              ${s.tier?`<span class="loc-tier tier-${s.tier.toLowerCase()}">${s.tier}</span>`:''}
            </div>
            <div class="loc-name">${s.name}</div>
            <div class="loc-purpose">${s.purpose}</div>
            <div class="loc-content">${s.content.map(c=>`<span>${c}</span>`).join('')}</div>
            <div class="loc-style">${s.style}</div>
          </div>`).join('')}
      </div>
    </section>` : '';

  // ---- Publishing: weekly template + monthly output ----
  const pub=d.publishing;
  let pubHtml='';
  if(pub){
    // Month-aware overrides: pull this month's Coach's Corner topic + Sunday content from the calendar
    let pubM=null;
    if(d.calendar && Array.isArray(d.calendar.months)){
      const nowTag=new Date().toLocaleString('en-US',{month:'short',year:'numeric'});
      pubM=(d.calendar.months.find(m=>m.month===nowTag)||{}).pub_monthly||null;
    }
    const dayCard=(w)=>{
      let show=w.show, desc=w.desc, tie='';
      // Coach's Corner: monthly topic overrides the Current-Focus tie
      if(w.show==="Coach's Corner"){
        if(pubM && pubM.coaches_corner){ tie=`<div class="pub-tie">This month: ${pubM.coaches_corner}</div>`; }
        else if(cf){ tie=`<div class="pub-tie">This week: ${cf.focus}</div>`; }
      }
      // Sunday: monthly override of show name + description (e.g. Journal ↔ Floor Skills)
      if(w.day==="Sunday" && pubM && pubM.sunday){
        if(pubM.sunday.show) show=pubM.sunday.show;
        if(pubM.sunday.desc) desc=pubM.sunday.desc;
      }
      return `<div class="pub-day ${w.type==='long'?'pub-long':'pub-short'}">
        <div class="pub-dayname">${w.day}</div>
        <div class="pub-show">${show}</div>
        <div class="pub-desc">${desc}</div>
        ${tie}
      </div>`;
    };
    pubHtml = `
    <section id="publishing">
      <div class="sec-head"><div class="sec-title">Publishing</div>
        <div class="sec-meta">${pub.cadence}</div></div>
      <div class="pub-week">${pub.weekly.map(dayCard).join('')}</div>
      ${pub.model?`<div class="pub-model">${pub.model}</div>`:''}
      ${pub.schedule_note?`<div class="pub-note">${pub.schedule_note}</div>`:''}
      ${pub.monthly_feature?`
        <div class="pub-feature">
          <div class="pub-feature-tag">Once a month · the Netflix episode</div>
          <div class="pub-feature-title">\u{1F3AC} ${pub.monthly_feature.title}</div>
          <div class="pub-feature-meta">${pub.monthly_feature.length} · ${pub.monthly_feature.cadence}</div>
          <div class="pub-feature-covers">${pub.monthly_feature.covers.map(c=>`<span>${c}</span>`).join('')}</div>
          <div class="pub-feature-note">${pub.monthly_feature.note}</div>
        </div>`:''}
      <div class="pub-sub">
        <div class="pub-block">
          <div class="pub-block-h">Always collect B-roll</div>
          <div class="broll">${pub.broll.map(b=>`<span class="broll-tag">${b}</span>`).join('')}</div>
        </div>
      </div>
    </section>`;
  }

  // ---- Calendar: combined content + assessment timeline ----
  const cal=d.calendar;
  const pillarClass={"Foundation":"pl-foundation","Strength":"pl-strength","Mobility":"pl-mobility","Longevity":"pl-longevity"};
  const curMonthStr = new Date().toLocaleString('en-US',{month:'short',year:'numeric'});
  const calHtml = cal ? `
    <section id="calendar">
      <div class="sec-head"><div class="sec-title">Calendar</div>
        <div class="sec-meta">${cal.season}<br>Tests feed the episodes</div></div>
      <div class="cal-list">
        ${cal.months.map(m=>{
          const isNow = m.month===curMonthStr;
          // checkable item: stable key = month|type|index, state from localStorage
          const ckey=(type,i)=>`p50check::${m.month}::${type}::${i}`;
          const ckItem=(txt,type,i)=>{
            const done = localStorage.getItem(ckey(type,i))==='1';
            return `<li class="ck-item ${done?'ck-done':''}" data-ckey="${ckey(type,i)}">
              <span class="ck-box">${done?'✓':''}</span><span class="ck-txt">${txt}</span></li>`;
          };
          const countDone=(type,arr)=>arr.reduce((n,_,i)=>n+(localStorage.getItem(ckey(type,i))==='1'?1:0),0);
          const aDone=countDone('assess',m.assessments||[]);
          const bDone=m.broll?countDone('broll',m.broll):0;
          return `
          <div class="cal-month ${isNow?'cal-now':''}">
            <div class="cal-month-head">
              <div class="cal-mname">${m.month}${isNow?' <span class="cal-nowtag">This month</span>':''}</div>
              <div class="cal-pillar ${pillarClass[m.pillar]||''}">${m.pillar}</div>
            </div>
            <div class="cal-cols">
              <div class="cal-col">
                <div class="cal-col-h"><i class="dot-film"></i>Episodes</div>
                <ul>${m.episodes.map(e=>`<li>${e}</li>`).join('')}</ul>
              </div>
              <div class="cal-col">
                <div class="cal-col-h"><i class="dot-test"></i>Assessments <span class="ck-count" data-count-type="assess" data-count-month="${m.month}">${aDone}/${(m.assessments||[]).length}</span></div>
                <ul class="ck-list">${(m.assessments||[]).map((a,i)=>ckItem(a,'assess',i)).join('')}</ul>
              </div>
            </div>
            ${(m.broll && m.broll.length) ? `
            <details class="cal-broll">
              <summary><i class="dot-broll"></i>B-roll shot list <span class="cal-broll-count ck-count" data-count-type="broll" data-count-month="${m.month}">${bDone}/${m.broll.length}</span></summary>
              <ul class="ck-list">${m.broll.map((b,i)=>ckItem(b,'broll',i)).join('')}</ul>
            </details>` : ''}
            ${calRaceHtml(m.race)}
          </div>`;
        }).join('')}
      </div>
    </section>` : '';

  // ===== CONTENT BANK (series curriculum + topic banks, checkable) =====
  const cb=d.content_bank;
  let cbHtml='';
  if(cb){
    const cbKey=(scope,i)=>`p50cb::${scope}::${i}`;
    const cbItem=(txt,scope,i)=>{
      const done=localStorage.getItem(cbKey(scope,i))==='1';
      return `<li class="ck-item ${done?'ck-done':''}" data-ckey="${cbKey(scope,i)}">
        <span class="ck-box">${done?'✓':''}</span><span class="ck-txt">${txt}</span></li>`;
    };
    // series: flat index across all tiers so keys stay stable
    const seriesBlocks=(cb.series||[]).map(s=>{
      let idx=0, done=0, total=0;
      const scope='series::'+s.title;
      const tiersHtml=(s.tiers||[]).map(t=>{
        const rows=t.items.map(it=>{ const html=cbItem(it,scope,idx); if(localStorage.getItem(cbKey(scope,idx))==='1')done++; total++; idx++; return html; }).join('');
        return `<div class="cb-tier"><div class="cb-tier-h">${t.tier}</div><ul class="ck-list">${rows}</ul></div>`;
      }).join('');
      return `<details class="cb-block" open>
        <summary><i class="dot-film"></i>${s.title} <span class="ck-count" data-cb-scope="${scope}">${done}/${total}</span></summary>
        <div class="cb-sub">${s.subtitle||''}</div>
        ${tiersHtml}
      </details>`;
    }).join('');
    // banks: simple checkable lists
    const bankBlocks=(cb.banks||[]).map(b=>{
      const scope='bank::'+b.title;
      let done=0;
      const rows=b.items.map((it,i)=>{ if(localStorage.getItem(cbKey(scope,i))==='1')done++; return cbItem(it,scope,i); }).join('');
      return `<details class="cb-block">
        <summary><i class="dot-broll"></i>${b.title} <span class="ck-count" data-cb-scope="${scope}">${done}/${b.items.length}</span></summary>
        <div class="cb-sub">${b.subtitle||''}</div>
        <ul class="ck-list">${rows}</ul>
      </details>`;
    }).join('');
    cbHtml=`
    <section id="contentbank">
      <div class="sec-head"><div class="sec-title">Content Bank</div>
        <div class="sec-meta">Series curriculum + topic pools<br>Tap to mark filmed</div></div>
      ${seriesBlocks}${bankBlocks}
    </section>`;
  }

  // Registration windows are the thing that actually gets missed — Nov 7 sold
  // out while the plan was being written around it — so the status is computed
  // live against today rather than being a static "register 3-4 months out".
  function toBookHtml(tb){
    if(!tb || !Array.isArray(tb.slots)) return '';
    const today=new Date(); const t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    const parse=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
    const days=(a,b)=>Math.round((b-a)/86400000);
    const slot=s=>{
      const o=parse(s.opens), c=parse(s.closes);
      let cls='tb-soon', txt='';
      if(o && t0<o) txt='opens in '+days(t0,o)+' days';
      else if(c && t0<=c){ cls='tb-open'; txt='open now — '+days(t0,c)+' days left'; }
      else { cls='tb-late'; txt='overdue — book today'; }
      const win=(o?o.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'')
        +(c?' \u2192 '+c.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'');
      const cands=(s.candidates||[]).map(x=>`
        <div class="tb-cand${x.star?' tb-star':''}">
          <div class="tb-cand-b">
            <div class="tb-cn">${x.star?'\u2b50 ':''}${x.name}</div>
            <div class="tb-cd">${x.dist} &middot; ${x.date}</div>
            <div class="tb-cnote">${x.note||''}</div>
          </div>
          <a class="tb-go" href="${x.url}" target="_blank" rel="noopener">Check \u2197</a>
        </div>`).join('');
      return `<div class="tb-slot">
        <div class="tb-slot-h"><span class="tb-what">Rung ${s.rung} &mdash; ${s.what}</span>
          <span class="tb-status ${cls}">${txt}</span></div>
        <div class="tb-win">${win}</div>
        <div class="tb-why">${s.why||''}</div>${cands}
      </div>`;
    };
    return `<div class="tb">
      <div class="tb-h">${tb.headline||'Races to book'}</div>
      <div class="tb-note">${tb.note||''}</div>
      ${tb.caveat?`<div class="tb-caveat">${tb.caveat}</div>`:''}
      ${tb.slots.map(slot).join('')}
      ${(tb.ruled_out||[]).map(r=>`<div class="tb-out"><b>Ruled out &mdash; ${r.name}:</b> ${r.reason}
        <a class="tb-go" href="${r.url}" target="_blank" rel="noopener">See it \u2197</a></div>`).join('')}
      ${(tb.calendars||[]).length?`<div class="tb-sub">Calendars to scan</div>
        <div class="tb-cals">${tb.calendars.map(c=>`<a class="tb-go" href="${c.url}" target="_blank" rel="noopener">${c.label} \u2197</a>`).join('')}</div>`:''}
      ${(tb.checklist||[]).length?`<div class="tb-sub">Confirm on each</div>
        <ul class="tb-check">${tb.checklist.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    </div>`;
  }

  // ===== RACE LADDER (progression to Moab 100) =====
  // ISO date -> "Dec 5 2026", parsed as local so it doesn't slip a day in
  // negative-offset timezones the way new Date('2026-12-05') would.
  function fmtRaceDate(iso){
    const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');
    if(!m) return iso||'';
    const dt=new Date(+m[1], +m[2]-1, +m[3]);
    return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  }
  // The seven-phase arc. Lives in data.json and drives the header phase; this
  // strip is the only place the whole journey is visible at once.
  let phHtml='';
  if(Array.isArray(d.phases) && d.phases.length){
    const nowP = currentPhase(d, new Date());
    const cells = d.phases.map(p=>{
      const state = !nowP ? '' : (p.n < nowP.n ? 'ph-done' : (p.n === nowP.n ? 'ph-now' : ''));
      return `<div class="ph-cell ${state}" title="${p.anchor||''}">
        <div class="ph-n">${p.n}</div>
        <div class="ph-name">${p.name}</div>
        <div class="ph-note">${p.note||''}</div>
      </div>`;
    }).join('');
    phHtml = `<section id="phases">
      <div class="sec-head"><div class="sec-title">The Arc</div>
        <div class="sec-meta">Seven phases, thyroid panel to Moab<br>Current phase derived from the calendar</div></div>
      <div class="ph-strip">${cells}</div></section>`;
  }

  const rl=d.race_ladder;
  let rlHtml='';
  if(rl){
    const rKey=(n)=>`p50race::${n}`;
    const rungs=(rl.rungs||[]).map(r=>{
      const done=localStorage.getItem(rKey(r.n))==='1';
      return `<details class="race-rung ${r.capstone?'race-capstone':''} ${done?'race-done':''}">
        <summary>
          <span class="race-check" data-race="${r.n}" role="button">${done?'✓':''}</span>
          <span class="race-num">${r.capstone?'\u{1F3AF}':r.n}</span>
          <span class="race-dist">${r.dist}</span>
          <span class="race-window">${r.window}</span>
          ${(r.target_date||r.target_window)?`<span class="race-date${r.date_status==='registered'?' race-booked':''}">${r.date_status==='registered'?'\u2713 ':''}${r.target_date?fmtRaceDate(r.target_date):r.target_window}</span>`:''}
        </summary>
        <div class="race-body">
          <div class="race-purpose">${r.purpose}</div>
          ${r.goal?`<div class="race-goal"><span class="race-lbl">Goal</span>${r.goal}</div>`:''}
          ${r.gate?`<div class="race-row"><span class="race-lbl">Training gate</span>${r.gate}</div>`:''}
          ${r.fuel_target?`<div class="race-row"><span class="race-lbl">Fuel target</span>${r.fuel_target}</div>`:''}
          ${r.vert_prep?`<div class="race-row"><span class="race-lbl">Vert prep</span>${r.vert_prep}</div>`:''}
          ${r.kit?`<div class="race-row"><span class="race-lbl">Kit</span>${r.kit}</div>`:''}
          <div class="race-row"><span class="race-lbl">Candidates</span>${r.candidates}</div>
          <div class="race-row race-signup"><span class="race-lbl">Sign up</span>${r.signup}</div>
          ${(r.links&&r.links.length)?`<div class="race-links">${r.links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a>`).join('')}</div>`:''}
          ${r.teaches?`<div class="race-teaches"><b>What this rung teaches:</b> ${r.teaches}</div>`:''}
        </div>
      </details>`;
    }).join('');
    rlHtml=`
    <section id="raceladder">
      <div class="sec-head"><div class="sec-title">Race Ladder</div>
        <div class="sec-meta">${rl.goal}<br>Tap ✓ when raced</div></div>
      ${toBookHtml(rl.to_book)}
      <div class="race-rules">${(rl.rules||[]).map(x=>`<div class="race-rule">${x}</div>`).join('')}</div>
      ${rungs}
      ${rl.bridge?`<div class="race-bridge">${rl.bridge}</div>`:''}
    </section>`;
  }

  // "Weekly now" and "Long run now" were hand-typed and had drifted badly -
  // they still read 12-15 mi/wk and 5-6 mi from Block 1's opening weeks while
  // the log had him at 21-22 mi/wk with an 11-12 mi long run. Read them off
  // the current week instead; the data.json strings stay as the fallback for
  // weeks with no daily plan (the retest weeks).
  function currentVolume(log, d){
    const DOWK=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const wk=resolveTrainingWeek(log, programWeekNumber(d, new Date()), new Date());
    const days=wk && weekDays(wk);
    if(!days) return null;
    const ms=DOWK.map(k=>(days[k]||{}).mileage||0);
    const total=ms.reduce((a,b)=>a+b,0);
    // A retest/deload week carries no mileage by design. Say so rather than
    // falling through to a hand-typed number that describes some other week.
    if(total<=0) return { weekly: 'Deload week', longest: 'Retest \u2014 no run target', week: wk.week };
    return { weekly: `${Math.round(total*10)/10} mi/wk`,
             longest: `${Math.max(...ms)} mi`, week: wk.week };
  }

  // ===== MILEAGE TARGETS (current-phase running guidance) =====
  const mi=d.mileage;
  let miHtml='';
  if(mi){
    const vol=currentVolume(window.__LOG__, d);
    const wk=(mi.week_structure||[]).map(w=>`
      <div class="mi-day">
        <div class="mi-dayname">${w.day}</div>
        <div class="mi-run">${w.run}</div>
        <div class="mi-note">${w.note}</div>
      </div>`).join('');
    miHtml=`
    <section id="mileage">
      <div class="sec-head"><div class="sec-title">Mileage Targets</div>
        <div class="sec-meta">${mi.phase}<br>${mi.phase_window}</div></div>
      <div class="mi-stats">
        <div class="mi-stat"><div class="mi-k">Weekly now</div><div class="mi-v">${vol?vol.weekly:mi.current_weekly}</div></div>
        <div class="mi-stat"><div class="mi-k">Weekly target</div><div class="mi-v">${mi.target_weekly}</div></div>
        <div class="mi-stat"><div class="mi-k">Long run now</div><div class="mi-v">${vol?vol.longest:mi.long_run_now}</div></div>
        <div class="mi-stat"><div class="mi-k">Long run target</div><div class="mi-v">${mi.long_run_target}</div></div>
      </div>
      <div class="mi-rule">${mi.rule}</div>
      <div class="mi-week">${wk}</div>
      ${mi.bjj_lever?`<div class="mi-lever"><b>BJJ lever:</b> ${mi.bjj_lever}</div>`:''}
      ${mi.vert_note?`<div class="mi-vert"><b>Vertical:</b> ${mi.vert_note}</div>`:''}
      ${mi.ladder_note?`<div class="mi-ladder">${mi.ladder_note}</div>`:''}
    </section>`;
  }
  // ===== FUELING / GUT TRAINING =====
  // The gut is a trainable system on the same ladder as the legs, so this
  // section is keyed to the block you're in and the rung you're climbing toward.
  const fu=d.fueling;
  let fuHtml='';
  if(fu){
    const cb=fu.current_block||{};
    const stages=(fu.ladder||[]).map(s=>{
      // stage labels read "Block 2 \u2014 Trail Half"; match on the block number,
      // which is stable, rather than on the block's display name.
      const now=cb.block!=null && s.stage && s.stage.indexOf('Block '+cb.block)===0;
      return `<div class="fuel-stage${now?' now':''}">
        <div class="fuel-st-n">${s.stage}</div>
        <div class="fuel-st-c">${/\/hr/.test(s.carbs_per_hr)?s.carbs_per_hr:s.carbs_per_hr+' g/hr'}</div>
        <div class="fuel-st-d">${s.duration}</div>
        <div class="fuel-st-f">${s.focus}</div>
      </div>`;
    }).join('');
    const rules=(fu.long_run_rules||[]).map(r=>`<li>${r}</li>`).join('');
    const tplLabels={night_before:'Night before',breakfast:'Breakfast',final_top_up:'Final top-up',
      on_course:'On course',when_it_goes_wrong:'If it goes wrong',after:'After'};
    const tpl=Object.keys(tplLabels)
      .filter(k=>(fu.race_day_template||{})[k])
      .map(k=>`<div class="fuel-tl-k">${tplLabels[k]}</div><div class="fuel-tl-v">${fu.race_day_template[k]}</div>`)
      .join('');
    const gi=(fu.gi_troubleshooting||[]).map(g=>`<div class="gi-row">
      <div class="gi-sym">${g.symptom}</div>
      <div class="gi-why">Likely: ${g.likely}</div>
      <div class="gi-try"><b>Try</b>${g.try}</div>
    </div>`).join('');
    fuHtml=`
    <section id="fueling">
      <div class="sec-head"><div class="sec-title">${fu.headline||'Fueling'}</div>
        <div class="sec-meta">Gut training for the race ladder<br>Log GI comfort every long run</div></div>
      <div class="fuel-lede">${fu.principle||''}</div>
      ${cb.target_range?`<div class="fuel-now">
        <div class="fuel-now-h">Block ${cb.block} target &mdash; ${cb.name}</div>
        <div class="fuel-now-v">${cb.target_range}</div>
        <div class="fuel-now-n">${cb.note||''}</div>
      </div>`:''}
      ${fu.caveat?`<div class="fuel-caveat">${fu.caveat}</div>`:''}
      ${stages?`<div class="fuel-sub">Carb ladder &mdash; block by block</div><div class="fuel-ladder">${stages}</div>`:''}
      ${rules?`<div class="fuel-sub">Long-run rules</div><ul class="fuel-rules">${rules}</ul>`:''}
      ${tpl?`<div class="fuel-sub">Race-day template</div><div class="fuel-tl">${tpl}</div>`:''}
      ${gi?`<div class="fuel-sub">When the stomach turns</div>${gi}`:''}
      ${fu.products_to_test?`<div class="fuel-test"><b>Test now, not later:</b> ${fu.products_to_test}</div>`:''}
    </section>`;
  }

  // Short runs repeat weekly, so this is a rotating menu keyed to session type
  // rather than a bespoke pick per week. Each Wednesday workout gets its own
  // entry because hill repeats, tempo, strides and race-pace want different
  // ground — a single "Wednesday" list would be wrong for most weeks.
  function shortRunsHtml(d, curWk){
    const sr=d.short_runs;
    if(!sr || !Array.isArray(sr.sessions)) return '';
    const tagClass=t=>'sr-tag-'+String(t||'').toLowerCase().replace(/[^a-z]/g,'');
    const opt=o=>`
      <div class="sr-opt">
        <div class="sr-opt-h"><span class="sr-tag ${tagClass(o.tag)}">${o.tag}</span>
          <span class="tr-name">${o.name}</span></div>
        <div class="tr-park">${o.park}</div>
        <div class="tr-stats">
          <span class="tr-stat"><b>${o.miles}</b> mi</span>
          <span class="tr-stat"><b>${o.vert_ft.toLocaleString()}</b> ft vert</span>
          ${o.trailhead_mi!=null?`<span class="tr-stat"><b>${o.trailhead_mi}</b> mi to trailhead</span>`:'<span class="tr-stat">paved</span>'}
          <span class="tr-stat">${o.route_type}</span>
          <span class="tr-stat">${o.difficulty}</span>
          <span class="tr-stat">★ <b>${o.rating}</b></span>
        </div>
        <div class="tr-why">${o.why}</div>
        ${o.how?`<div class="sr-how"><b>How to run it</b>${o.how}</div>`:''}
        <a class="tr-link" href="${o.url}" target="_blank" rel="noopener">AllTrails ↗</a>
      </div>`;
    const sess=s=>{
      const active = curWk!==null && Array.isArray(s.weeks) && s.weeks.indexOf(curWk)!==-1;
      return `<details class="sr-sess${active?' sr-now':''}"${active?' open':''}>
        <summary>
          <span class="sr-day">${s.day}</span>
          <span class="sr-title">${s.title}</span>
          <span class="sr-dist">${s.distance}</span>
          <span class="sr-when">${s.when}</span>
        </summary>
        <div class="sr-body">
          ${s.need?`<div class="sr-need"><b>Needs</b>${s.need}</div>`:''}
          ${s.avoid?`<div class="sr-avoid"><b>Avoid</b>${s.avoid}</div>`:''}
          ${s.options.map(opt).join('')}
        </div>
      </details>`;
    };
    return `
      <div class="tr-sub">Short runs &mdash; Monday, Tuesday, Wednesday</div>
      <div class="tr-subnote">${sr.principle||''}</div>
      ${sr.rotation?`<div class="sr-rot">${sr.rotation}</div>`:''}
      ${sr.sessions.map(sess).join('')}
      ${sr.caveat?`<div class="tr-caveat">${sr.caveat}</div>`:''}`;
  }

  // ===== LONG-RUN TRAILS =====
  // Options are pinned to a training week, so the "up next" card resolves the
  // same way the Today card does: by the log's week_start dates, not by a
  // guessed week number.
  const tr=d.trails;
  let trHtml='';
  if(tr && Array.isArray(tr.weeks)){
    const curWk = currentTrainingWeek(window.__LOG__, d);
    const upcoming = tr.weeks.find(w=>curWk!==null && w.week>=curWk) || null;

    const optHtml=(o,i)=>`
      <div class="tr-opt">
        <div class="tr-opt-h"><span class="tr-rank">${i+1}</span>
          <span class="tr-name">${o.name}</span></div>
        <div class="tr-park">${o.park}</div>
        <div class="tr-stats">
          <span class="tr-stat"><b>${o.miles}</b> mi</span>
          <span class="tr-stat"><b>${o.vert_ft.toLocaleString()}</b> ft vert</span>
          ${o.trailhead_mi!=null?`<span class="tr-stat"><b>${o.trailhead_mi}</b> mi to trailhead</span>`:'<span class="tr-stat">paved</span>'}
          <span class="tr-stat">${o.route_type}</span>
          <span class="tr-stat">${o.difficulty}</span>
          <span class="tr-stat">★ <b>${o.rating}</b></span>
        </div>
        <div class="tr-why">${o.why}</div>
        ${o.adjust?`<div class="tr-adj"><b>To hit the number</b>${o.adjust}</div>`:''}
        <a class="tr-link" href="${o.url}" target="_blank" rel="noopener">AllTrails ↗</a>
      </div>`;

    const wkHtml=(w)=>`
      <details class="tr-wk${upcoming&&w.week===upcoming.week?' tr-now':''}"${upcoming&&w.week===upcoming.week?' open':''}>
        <summary>
          <span class="tr-wknum">WK ${w.week}</span>
          <span class="tr-wkmi">${w.long_run_mi} mi</span>
          <span class="tr-wkvert">${w.long_run_vert} on the long run</span>
          <span class="tr-wkneed">${w.need}</span>
        </summary>
        <div class="tr-body">${w.options.map(optHtml).join('')}</div>
      </details>`;

    trHtml=`
    <section id="trails">
      <div class="sec-head"><div class="sec-title">${tr.headline||'Long-Run Trails'}</div>
        <div class="sec-meta">${tr.anchor||''}<br>Three options per Sunday, closest first</div></div>
      <div class="tr-lede">${tr.principle||''}</div>
      ${upcoming?`<div class="tr-next">
        <div class="tr-next-h">Up next &mdash; week ${upcoming.week} long run</div>
        <div class="tr-next-v">${upcoming.long_run_mi} mi &middot; ${upcoming.long_run_vert}</div>
        <div class="tr-next-n">${upcoming.need}</div>
      </div>`:`<div class="tr-next">
        <div class="tr-next-h">No long run scheduled</div>
        <div class="tr-next-v">Block 2 is done</div>
        <div class="tr-next-n">Race week and the recovery week carry no planned long run. These options stay here as a library &mdash; the next block gets its own set.</div>
      </div>`}
      ${tr.terrain_note?`<div class="tr-terrain">${tr.terrain_note}</div>`:''}
      ${tr.caveat?`<div class="tr-caveat">${tr.caveat}</div>`:''}
      ${tr.weeks.map(wkHtml).join('')}
      ${shortRunsHtml(d, curWk)}
    </section>`;
  }

  // ===== NUTRITION =====
  // Targets come from the blood panel, values from whatever app logs food into
  // Apple Health. The top-priority target gets a 30-day chart because a single
  // day's fibre says nothing — the question is whether it happens daily.
  const nu=d.nutrition;
  let nuHtml='';
  if(nu && Array.isArray(nu.targets)){
    const live=window.__LIVE__, hist=window.__HIST__;
    const val=k=>(live&&live.metrics&&typeof live.metrics[k]==='number')?live.metrics[k]:null;
    const targets=[...nu.targets].sort((a,b)=>(a.priority||99)-(b.priority||99));

    // Today's planned running, used to scale a dynamic target (water) — a flat
    // number is the wrong shape for someone whose days range 0 to 15 miles.
    const todayMiles=(()=>{
      const log=window.__LOG__;
      if(!log) return 0;
      const now=new Date();
      const wk=resolveTrainingWeek(log, programWeekNumber(d, now), now);
      const days=wk?weekDays(wk):null;
      const dk=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][now.getDay()];
      return (days && days[dk] && days[dk].mileage) || 0;
    })();
    // Planned mileage for an arbitrary date. A historical day has to be judged
    // against ITS OWN target — scoring a rest day against a 15-mile day's water
    // goal makes every past day look like a failure.
    function milesOn(date){
      const log=window.__LOG__;
      const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date||'');
      if(!log || !m) return 0;
      const dt=new Date(+m[1], +m[2]-1, +m[3]);
      const wk=resolveTrainingWeek(log, programWeekNumber(d, dt), dt);
      const days=wk?weekDays(wk):null;
      const dk=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];
      return (days && days[dk] && days[dk].mileage) || 0;
    }
    function targetFor(t, miles){
      const dy=t.dynamic;
      if(!dy) return t.target;
      const hours=miles>0 ? miles*(dy.pace_min_per_mile||12)/60 : 0;
      return (dy.baseline_oz||t.target) + Math.round(hours*(dy.per_training_hour_oz||0)/5)*5;
    }
    function dynamicTarget(t){
      const dy=t.dynamic;
      if(!dy) return { value:t.target, note:null };
      const value=targetFor(t, todayMiles);
      const hours=todayMiles>0 ? todayMiles*(dy.pace_min_per_mile||12)/60 : 0;
      return { value, note: todayMiles>0
        ? `${dy.baseline_oz} baseline + ${value-dy.baseline_oz} for today's ${todayMiles} mi (~${hours.toFixed(1)} hr)`
        : `${dy.baseline_oz} baseline — no run planned today` };
    }

    function chartFor(t){
      const dt=dynamicTarget(t), goal=dt.value;
      if(!(hist && Array.isArray(hist.days) && hist.days.length))
        return '<div class="nu-empty">No data synced yet. Log a day in your nutrition app with Apple Health sharing on, and the chart fills in.</div>';
      const series=hist.days.map(x=>({date:x.date, v:(x.metrics&&typeof x.metrics[t.key]==='number')?x.metrics[t.key]:null}));
      if(!series.some(p=>p.v!==null))
        return '<div class="nu-empty">Nothing logged for this one yet.</div>';
      // Each day carries its own target for a dynamic metric; the dashed line
      // marks the baseline, and a run day's bar is scored against its own bar.
      const base=t.dynamic ? (t.dynamic.baseline_oz||t.target) : goal;
      const max=Math.max(goal, base, ...series.map(p=>p.v||0))*1.1;
      const goalPct=100-(base/max*100);
      const hit=(v,dayTarget)=>t.direction==='up'?v>=dayTarget:(t.direction==='down'?v<=dayTarget:true);
      const bars=series.map(p=>{
        if(p.v===null) return `<div class="nu-bar nu-none" style="height:3px" title="${p.date}: no log"></div>`;
        const dayT=targetFor(t, milesOn(p.date));
        return `<div class="nu-bar ${hit(p.v,dayT)?'nu-hit':''}" style="height:${Math.max(3,(p.v/max)*100)}%" title="${p.date}: ${Math.round(p.v)} ${t.unit} (target ${dayT})"></div>`;
      }).join('');
      const logged=series.filter(p=>p.v!==null);
      const hits=logged.filter(p=>hit(p.v, targetFor(t, milesOn(p.date)))).length;
      return `<div class="nu-chart"><div class="nu-goal" style="top:${goalPct}%"><span>${t.dynamic?'baseline':(t.direction==='down'?'max':'target')} ${base}</span></div>${bars}</div>
        <div class="nu-xlab"><span>${series[0].date}</span><span>${hits}/${logged.length} days ${t.direction==='down'?'under':'on target'}</span><span>${series[series.length-1].date}</span></div>`;
    }

    const charted=targets.filter(t=>t.chart);
    const heroes=charted.map(t=>{
      const dt=dynamicTarget(t);
      return `<div class="nu-hero">
        <div class="nu-hero-h"><span class="nu-hero-n">${t.name} &mdash; last 30 days</span>
          <span class="nu-hero-t">${t.direction==='down'?'max':'target'} ${dt.value} ${t.unit}/day &middot; ${t.marker}</span></div>
        ${dt.note?`<div class="nu-dyn">${dt.note}${t.dynamic&&t.dynamic.note?` &mdash; ${t.dynamic.note}`:''}</div>`:''}
        ${chartFor(t)}
      </div>`;
    }).join('');

    const rows=targets.map(t=>{
      const v=val(t.key), goal=dynamicTarget(t).value;
      const hit=v===null?null:(t.direction==='up'?v>=goal:(t.direction==='down'?v<=goal:true));
      return `<div class="nu-row">
        <span class="nu-rank">${t.priority}</span>
        <div class="nu-rb"><div class="nu-rn">${t.name}</div><div class="nu-rm">${t.marker}</div></div>
        <div class="nu-rv${v===null?' nu-no':''}">${v===null?'—':Math.round(v*10)/10}<small> / ${goal} ${t.unit}${t.direction==='down'?' max':''}</small></div>
      </div>
      <div class="nu-det">${t.why}<span class="nu-food"><b>Food</b>${t.food}</span></div>`;
    }).join('');

    const nt=nu.not_trackable||{};
    nuHtml=`
    <section id="nutrition-targets">
      <div class="sec-head"><div class="sec-title">${nu.headline||'Nutrition'}</div>
        <div class="sec-meta">From your blood panel, not generic RDAs<br>Synced daily from Apple Health</div></div>
      <div class="nu-lede">${nu.basis||''}</div>
      ${nu.medical_note?`<div class="nu-med">${nu.medical_note}</div>`:''}
      ${heroes}
      ${rows}
      ${nt.what?`<div class="nu-nt"><b>Can't be tracked here &mdash; ${nt.what}:</b> ${nt.why}<br><span class="nu-rm">${nt.marker}</span></div>`:''}
      ${nu.caveat?`<div class="rc-caveat">${nu.caveat}</div>`:''}
    </section>`;
  }

  // ===== RECOVERY AUTO-COMPLETE =====
  // Auto-ticks come from the live HealthKit payload, not from data.json, so
  // they reflect today rather than whatever was last committed. A manual tick
  // is per-device localStorage, same as the race-ladder checkmarks. An auto
  // tick can be overridden manually — evidence a session happened is not proof
  // the whole stack was done.
  function recoveryKey(tool){ return 'p50rec::'+new Date().toISOString().slice(0,10)+'::'+tool; }
  const rcSync=d.recovery_sync;
  let rcHtml='';
  if(rcSync && Array.isArray(rcSync.mappings)){
    const live=window.__LIVE__;
    const sigKey=(rcSync.signal||{}).key;
    const sigVal=(live && live.metrics && typeof live.metrics[sigKey]==='number') ? live.metrics[sigKey] : null;
    const freq={};
    ((window.__LOG__||{}).recovery_tools||[]).forEach(t=>{ freq[t.tool]=t.frequency; });
    const rows=rcSync.mappings.map(m=>{
      const auto = m.mode==='auto' && sigVal!==null && sigVal>=(m.threshold_min||0);
      const manual = localStorage.getItem(recoveryKey(m.tool))==='1';
      const off = localStorage.getItem(recoveryKey(m.tool))==='0';
      const done = off ? false : (auto || manual);
      return `<div class="rc-tool${done?' rc-done':''}" data-rc="${m.tool}">
        <span class="rc-box">${done?'\u2713':''}</span>
        <div class="rc-b">
          <div class="rc-tn">${m.tool}<span class="rc-tag ${m.mode==='auto'?'rc-tag-auto':'rc-tag-manual'}">${m.mode==='auto'?'auto':'manual'}</span></div>
          <div class="rc-meta">${freq[m.tool]||''}${(m.mode==='auto'&&m.threshold_min)?` \u00b7 ticks at ${m.threshold_min}+ min`:''}${auto?' \u00b7 auto-ticked today':''}</div>
          <div class="rc-why">${m.why||''}</div>
        </div>
      </div>`;
    }).join('');
    const sig=rcSync.signal||{};
    rcHtml=`
    <section id="recovery-sync">
      <div class="sec-head"><div class="sec-title">${rcSync.headline||'Recovery'}</div>
        <div class="sec-meta">What the Watch can see, ticked for you<br>Everything else is one tap</div></div>
      <div class="rc-lede">${rcSync.principle||''}</div>
      ${rcSync.how_to_log?`<div class="rc-how"><b>How to log it:</b> ${rcSync.how_to_log}</div>`:''}
      <div class="rc-sig">
        <div class="rc-sig-h">${sig.label||'Signal'} today</div>
        <div class="rc-sig-v${sigVal===null?' rc-none':''}">${sigVal===null?'no session synced yet':sigVal+' min'}</div>
        <div class="rc-sig-n">${sig.source||''}${sig.note?' \u00b7 '+sig.note:''}</div>
      </div>
      ${rows}
      ${rcSync.caveat?`<div class="rc-caveat">${rcSync.caveat}</div>`:''}
    </section>`;
  }

  // ===== COACHING =====
  const co=d.coaching;
  let coHtml='';
  if(co){
    const z=co.zones||{};
    const rows=(z.bands||[]).map(b=>`<tr class="${/Z2/.test(b.zone)?'co-z2':''}">
      <td>${b.zone}</td><td class="co-bpm">${b.bpm}</td><td>${b.feel}</td><td>${b.use}</td></tr>`).join('');
    const skills=(co.skills||[]).map(s=>`<div class="co-skill">
      <div class="co-sn">${s.name}</div>
      <div class="co-cue">${s.cue}</div>
      <div class="co-why">${s.why}</div>
      ${s.drill?`<div class="co-drill"><b>Practise</b>${s.drill}</div>`:''}
    </div>`).join('');
    const wu=co.warmup||{};
    coHtml=`
    <section id="coaching">
      <div class="sec-head"><div class="sec-title">${co.headline||'Coaching'}</div>
        <div class="sec-meta">Effort, form and the two ultra skills<br>Zones from your own resting HR</div></div>
      <div class="co-lede">${co.principle||''}</div>
      ${z.ceiling?`<div class="co-ceiling">
        <div class="co-ceiling-h">Easy-run ceiling</div>
        <div class="co-ceiling-v">${String(z.ceiling).split('—')[0].trim()}</div>
        <div class="co-ceiling-n">${String(z.ceiling).split('—').slice(1).join('—').trim()}</div>
      </div>`:''}
      ${z.talk_test?`<div class="co-talk"><b>Talk test (the primary control):</b> ${z.talk_test}</div>`:''}
      ${rows?`<table class="co-zt"><tr><th>Zone</th><th>BPM</th><th>Feel</th><th>Use</th></tr>${rows}</table>`:''}
      ${z.basis?`<div class="co-caveat"><b>How these were derived:</b> ${z.basis}</div>`:''}
      ${co.caveat?`<div class="co-caveat">${co.caveat}</div>`:''}
      ${skills?`<div class="co-sub">Form and skills</div>${skills}`:''}
      ${(wu.before||wu.after)?`<div class="co-sub">Warm-up and cool-down</div><div class="co-wu">
        ${wu.before?`<div class="co-wu-k">Before</div><div class="co-wu-v">${wu.before}</div>`:''}
        ${wu.after?`<div class="co-wu-k">After</div><div class="co-wu-v">${wu.after}</div>`:''}
      </div>`:''}
      ${(co.stop_signals||[]).length?`<div class="co-sub">Stop the run</div>
        <ul class="co-stop">${co.stop_signals.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    </section>`;
  }

  const todayHtml = buildTodayCard(d, window.__LOG__, project50, scoreClass);

  document.getElementById('main').innerHTML =
    todayHtml + focusHtml + scoreBlockHtml + gaugeHtml + html + pubHtml + calHtml + cbHtml + phHtml + rlHtml + miHtml + fuHtml + trHtml + coHtml + rcHtml + nuHtml + locHtml + winsHtml;

  // ---- Checkable to-do / B-roll items (per-device, localStorage) ----
  const mainEl=document.getElementById('main');
  mainEl.addEventListener('click', (e)=>{
    // supplement expand/collapse
    const supp=e.target.closest('.supp-toggle');
    if(supp){ supp.closest('.supp-item').classList.toggle('open'); return; }
    // recovery tool tick — an explicit '0' records "auto said yes, I say no"
    const rt=e.target.closest('.rc-tool');
    if(rt){
      const tool=rt.dataset.rc, key=`p50rec::${new Date().toISOString().slice(0,10)}::${tool}`;
      const wasDone=rt.classList.contains('rc-done');
      localStorage.setItem(key, wasDone?'0':'1');
      rt.classList.toggle('rc-done', !wasDone);
      rt.querySelector('.rc-box').textContent = wasDone?'':'\u2713';
      return;
    }
    // race ladder checkmark (inside summary — prevent the details toggle)
    const rc=e.target.closest('.race-check');
    if(rc){
      e.preventDefault(); e.stopPropagation();
      const n=rc.dataset.race, key=`p50race::${n}`;
      const rung=rc.closest('.race-rung');
      const nowDone=rung.classList.toggle('race-done');
      rc.textContent=nowDone?'✓':'';
      if(nowDone) localStorage.setItem(key,'1'); else localStorage.removeItem(key);
      return;
    }
    const li=e.target.closest('li.ck-item');
    if(!li) return;
    const key=li.dataset.ckey;
    const nowDone = li.classList.toggle('ck-done');
    li.querySelector('.ck-box').textContent = nowDone ? '✓' : '';
    if(nowDone) localStorage.setItem(key,'1'); else localStorage.removeItem(key);
    // update the matching counter (works for calendar cols, broll, and content-bank blocks)
    const list=li.closest('.ck-list');
    if(list){
      const container=li.closest('.cal-col, .cal-broll, .cb-block');
      if(container){
        // content-bank series may have multiple ck-lists under one block; count them all
        const allItems=container.querySelectorAll('li.ck-item');
        const total=allItems.length;
        const done=container.querySelectorAll('li.ck-item.ck-done').length;
        const counter=container.querySelector('.ck-count');
        if(counter) counter.textContent=`${done}/${total}`;
      }
    }
  });
}

// ---- Today card builder ----
// Resolve which planned week a date falls in. Any week carrying a day plan is
// a candidate — deload/retest weeks included, since those carry real sessions
// under deload_days and shouldn't fall through to some earlier week's plan.
//
// A week with an explicit week_start (Block 2 onward) owns its calendar range
// exactly and is matched ONLY by date: the block boundaries don't land on clean
// 7-day multiples of program_start, so letting the arithmetic week number match
// a dated week would start Block 2 three days early. Past the end of everything
// written, this returns null rather than silently replaying an old week.
function weekDays(w){ return w.days || w.deload_days || null; }
function weekStartDate(w){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(w.week_start||'');
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function resolveTrainingWeek(log, wkNum, now){
  if(!log || !Array.isArray(log.weeks)) return null;
  const planned = log.weeks.filter(weekDays);
  if(!planned.length) return null;
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let wk = planned.find(w=>{
    const s=weekStartDate(w);
    if(!s) return false;
    const e=new Date(s.getFullYear(), s.getMonth(), s.getDate()+7);
    return today0>=s && today0<e;
  });
  if(wk) return wk;
  const datedEnd = planned.map(weekStartDate).filter(Boolean).sort((a,b)=>b-a)[0];
  if(datedEnd && today0 >= new Date(datedEnd.getFullYear(), datedEnd.getMonth(), datedEnd.getDate()+7)) return null;
  const undated = planned.filter(w=>!w.week_start);
  wk = undated.find(w=>w.week===wkNum);
  if(!wk && undated.length){
    const earlier = wkNum===null ? [] : undated.filter(w=>w.week<wkNum);
    wk = earlier.length ? earlier[earlier.length-1] : undated[0];
  }
  return wk || null;
}
// Program week number from the athlete's start date, or null if unset.
// Phase and race target were hand-typed strings in data.json and both had gone
// stale (phase still read "Baseline" in week 10; the target still read "first
// trail 10K" after the Dec 5 half was registered and paid). Derive both, so
// they track the calendar instead of needing a human to remember.
function currentPhase(d, now){
  const ph = Array.isArray(d.phases) ? d.phases.filter(p=>p.from) : [];
  if(!ph.length) return null;
  const t = now.getTime();
  const past = ph.filter(p=>new Date(p.from+'T00:00:00').getTime() <= t);
  return past.length ? past[past.length-1] : ph[0];
}
// The next rung not yet run. Rungs 4-6 carry only a target_window ("Oct 2027",
// "May-Jun 2028"), so they need an end date too - without one they never expire
// and the ladder stays stuck on the first undated rung forever.
const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function windowEnd(str){
  if(!str) return null;
  const year = (String(str).match(/\b(20\d{2})\b/)||[])[1];
  if(!year) return null;
  // A range ("May-Jun 2028") ends in its last named month.
  const months = String(str).toLowerCase().match(/[a-z]{3,}/g)||[];
  let mi = -1;
  months.forEach(m=>{ const i = MONTHS.indexOf(m.slice(0,3)); if(i>=0) mi = i; });
  if(mi<0) mi = 11;
  return new Date(Number(year), mi+1, 0); // last day of that month
}
function rungEnd(r){
  if(r.target_date) return new Date(r.target_date+'T00:00:00');
  return windowEnd(r.target_window || r.window || r.year);
}
function currentRaceTarget(d, now){
  const rungs = (d.race_ladder && d.race_ladder.rungs) || [];
  const t = now.getTime();
  const next = rungs.find(r => { if(r.done) return false;
    const e = rungEnd(r); return !e || e.getTime() >= t; });
  if(!next) return null;
  const when = next.target_date
    ? new Date(next.target_date+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})
    : (next.target_window || next.window || '');
  return { text: `${next.dist}${when?' \u2014 '+when:''}`, rung: next };
}

function programWeekNumber(d, now){
  const start = d.athlete && (d.athlete.program_start||d.athlete.project_start);
  if(!start) return null;
  const sd=new Date(start+'T00:00:00');
  return Math.floor(Math.floor((now - sd)/86400000)/7)+1;
}
// The week the trails section should point at: whatever week today falls in.
function currentTrainingWeek(log, d){
  const now=new Date();
  const wk=resolveTrainingWeek(log, programWeekNumber(d, now), now);
  return wk ? wk.week : null;
}

// Surface a matching trail on any running day rather than making him go find
// the section: the long run gets that week's top pick, a short run gets its
// session's Quick option — the one that means the run still happens when the
// day is tight. Silent on non-running days.
function trailLine(label, o, note){
  return `<div class="today-trail"><b>${label}</b>${o.name} &mdash; ${o.miles} mi, ${o.vert_ft.toLocaleString()} ft`
    + (o.trailhead_mi!=null?`, ${o.trailhead_mi} mi out`:'')
    + `. <a href="#trails">${note}</a></div>`;
}
function trailPickHtml(d, wk, day, dowKey){
  if(!wk) return '';
  const mi = day.mileage||0;
  if(mi<=0) return '';
  // Race day already has a venue. Suggesting a trail to drive to instead is
  // nonsense, and the distance fallback would otherwise match one to 13.1 mi.
  if((day.plan||[]).some(l=>/^\s*RACE\b/i.test(l))) return '';
  const longest = Math.max(...Object.values(weekDays(wk)||{}).map(x=>x.mileage||0));
  // Trail plans were written for Block 2 (weeks 13-22), so Block 1, race week
  // and the recovery week have no entry of their own. Rather than show nothing
  // on those days, borrow the option closest in distance from the whole pool
  // and label it as a match rather than a prescription.
  const closest = (pool, target) => {
    let best = null;
    pool.forEach(entry => (entry.options||[]).forEach(o => {
      if(typeof o.miles !== 'number') return;
      const gap = Math.abs(o.miles - target);
      if(!best || gap < best.gap) best = { gap, o, entry };
    }));
    return best;
  };

  // The week's longest run — that's the one the long-run planner covers.
  if(mi >= longest){
    const plans = (d.trails&&d.trails.weeks) || [];
    const plan = plans.find(w=>w.week===wk.week);
    if(plan){
      const o = plan.options && plan.options[0];
      return o ? trailLine('Trail', o, 'all 3 options →') : '';
    }
    const best = closest(plans, mi);
    return best ? trailLine('Trail', best.o, 'closest match · all options →') : '';
  }
  // Otherwise it's a short run: find the session type covering this day+week.
  const sessions = (d.short_runs&&d.short_runs.sessions) || [];
  const sess = sessions.find(
    s => s.day===dowKey && Array.isArray(s.weeks) && s.weeks.indexOf(wk.week)!==-1);
  if(sess){
    const q = (sess.options||[]).find(o=>o.tag==='Quick') || (sess.options||[])[0];
    return q ? trailLine(sess.title, q, 'other options →') : '';
  }
  // Prefer a session written for this weekday; fall back to the whole set.
  const sameDay = sessions.filter(s=>s.day===dowKey);
  const best = closest(sameDay.length ? sameDay : sessions, mi);
  return best ? trailLine(best.entry.title, best.o, 'closest match · other options →') : '';
}

// A calendar month may carry more than one dated event (the race, a
// registration window opening, a retest), so this takes an object or a list.
function calRaceHtml(race){
  if(!race) return '';
  const items = Array.isArray(race) ? race : [race];
  return items.filter(Boolean).map(r=>`<div class="cal-race">
    <div class="cal-race-h">${r.race}</div>
    <div class="cal-race-r">${r.reg||''}</div>
    ${(r.links&&r.links.length)?`<div class="race-links">${r.links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a>`).join('')}</div>`:''}
  </div>`).join('');
}

function buildTodayCard(d, log, project50, scoreClass){
  const now=new Date();
  const dowFull=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][now.getDay()];
  const dowKey=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][now.getDay()];
  const dateStr=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});

  // --- today's plan from training-log ---
  let planBlock='';
  if(log && Array.isArray(log.weeks)){
    // determine current program week from project_start
    const wkNum = programWeekNumber(d, now);
    const wk = resolveTrainingWeek(log, wkNum, now);
    const wkDays = wk ? weekDays(wk) : null;
    if(wkDays && wkDays[dowKey]){
      const day=wkDays[dowKey];
      const items=(day.plan||[]).map((p,i)=>`<li${i===0?' class="lead-item"':''}>${p}</li>`).join('');
      planBlock=`
        <div class="today-block">
          <div class="today-block-h"><span class="today-pillar">${day.pillar||''}</span> ${wk.block?`Block ${wk.block} · `:''}Week ${wk.week}${wk.phase?` (${wk.phase})`:''} · ${day.day_full||dowFull}</div>
          <ul class="today-plan">${items}</ul>
          ${day.recovery?`<div class="today-recovery">Recovery: ${linkifyRecovery(day.recovery)}</div>`:''}
          ${(wk.carbs_per_hr_target && (day.mileage||0)>0)?`<div class="today-fuel"><b>Fuel</b>${wk.carbs_per_hr_target} g carb/hr on anything over an hour — start at 30 min. <a href="#fueling">gut plan →</a></div>`:''}
          ${trailPickHtml(d, wk, day, dowKey)}
          <a class="today-cta" href="workout.html">Log this session →</a>
        </div>`;
    }
  }
  if(!planBlock){
    planBlock=`<div class="today-block"><div class="today-block-h">Today's plan</div>
      <div class="today-empty">No plan mapped for today — the written blocks may have run out. <a href="workout.html">Open the workout log →</a></div></div>`;
  }

  // --- next calendar item ---
  let calBlock='';
  if(d.calendar && Array.isArray(d.calendar.months)){
    const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const curTag=`${monthNames[now.getMonth()]} ${now.getFullYear()}`;
    let cm=d.calendar.months.find(m=>m.month===curTag) || d.calendar.months[0];
    if(cm){
      const eps=(cm.episodes||[]).slice(0,2).map(e=>`<li>${e}</li>`).join('');
      const tests=(cm.assessments||[]).slice(0,1).map(a=>`<li class="test">${a}</li>`).join('');
      calBlock=`
        <div class="today-block">
          <div class="today-block-h">${cm.month} · ${cm.pillar||''} <span class="today-linkinline"><a href="#calendar">full calendar →</a></span></div>
          <ul class="today-cal">${eps}${tests}</ul>
        </div>`;
    }
  }

  // --- score glance ---
  const sc = project50===null?'—':project50;
  const scoreBlock=`
    <div class="today-block today-score-inline">
      <div class="today-block-h">Project 50 Score <span class="today-linkinline"><a href="#p50-score">breakdown →</a></span></div>
      <div class="today-score ${scoreClass(project50)}">${sc}<small>/100</small></div>
    </div>`;

  return `
    <section id="today" class="today-card">
      <div class="today-head">
        <div class="today-eyebrow">Today</div>
        <div class="today-date">${dateStr}</div>
      </div>
      ${planBlock}
      ${calBlock}
      ${scoreBlock}
    </section>`;
}
</script>
<div class="routine-overlay" id="routineOverlay" onclick="if(event.target===this)closeRoutine()">
  <div class="routine-modal" id="routineModal"></div>
</div>
