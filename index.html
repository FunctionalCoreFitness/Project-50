<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project 50 — Omar Lima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141a22;
    --paper:#fafaf7;
    --card:#ffffff;
    --line:#e3e1d8;
    --hair:#eeece4;
    --muted:#7a828c;
    --navy:#16243a;
    --steel:#4a7ec7;
    --green:#3f8f5b;
    --amber:#c89031;
    --red:#c0503f;
    --track:#edebe3;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Barlow',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:1160px;margin:0 auto;padding:0 22px}

  /* ---------- Header ---------- */
  header{
    background:var(--navy);
    color:#eef1f6;
    padding:30px 0 26px;
    border-bottom:3px solid var(--steel);
  }
  .eyebrow{
    font-family:'Barlow Condensed',sans-serif;
    text-transform:uppercase;letter-spacing:.28em;
    font-size:.72rem;font-weight:600;color:var(--steel);
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(2.6rem,7vw,4.4rem);
    line-height:.92;letter-spacing:.01em;margin:.1em 0 .15em;
  }
  .sub{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;color:#c4ccd9;font-weight:500}

  .hero-stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
    background:rgba(255,255,255,.12);
    margin-top:24px;border:1px solid rgba(255,255,255,.12);
  }
  .hero-stat{background:var(--navy);padding:14px 16px}
  .hero-stat .k{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:.66rem;color:#8fa0bb;font-weight:600}
  .hero-stat .v{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1;margin-top:3px}
  .hero-stat .v small{font-size:.9rem;color:#aeb9cc;letter-spacing:.02em}

  /* ---------- Nav ---------- */
  nav{
    position:sticky;top:0;z-index:20;
    background:rgba(246,245,241,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .navrow{display:flex;gap:4px;overflow-x:auto;padding:9px 0;scrollbar-width:none}
  .navrow::-webkit-scrollbar{display:none}
  .navrow a{
    flex:0 0 auto;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;
    text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;
    color:var(--muted);text-decoration:none;padding:5px 12px;border-radius:2px;
    white-space:nowrap;transition:all .15s;
  }
  .navrow a:hover{color:var(--ink);background:var(--track)}
  .navrow a.nav-update{color:var(--steel);border:1px solid var(--steel);margin-left:6px}
  .navrow a.nav-update:hover{color:#fff;background:var(--steel)}
  .navrow a.nav-workout{color:var(--green);border:1px solid var(--green);margin-left:6px}
  .navrow a.nav-workout:hover{color:#fff;background:var(--green)}
  /* Today card */
  .today-card{background:linear-gradient(160deg,#1b2a4a 0%,#16243a 100%);color:#eef1f6;border:none;padding:20px 22px}
  .today-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:10px}
  .today-eyebrow{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.24em;font-size:.72rem;font-weight:600;color:var(--steel)}
  .today-date{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.02em;color:#fff}
  .today-block{margin-bottom:14px}
  .today-block:last-child{margin-bottom:0}
  .today-block-h{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;font-weight:600;color:#aeb9c9;margin-bottom:7px}
  .today-pillar{color:var(--steel);font-weight:700}
  .today-plan{list-style:none;padding:0;margin:0}
  .today-plan li{font-size:.9rem;color:#dce2ec;padding:2px 0 2px 14px;position:relative}
  .today-plan li:before{content:'·';position:absolute;left:2px;color:var(--steel)}
  .today-plan li.lead-item{font-weight:600;color:#fff}
  .today-recovery{font-size:.8rem;color:#9fb0c6;font-style:italic;margin-top:6px;line-height:1.4}
  .today-cta{display:inline-block;margin-top:10px;font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:.82rem;color:#fff;background:var(--green);padding:7px 14px;border-radius:3px;text-decoration:none}
  .today-cta:hover{filter:brightness(1.1)}
  .today-cal{list-style:none;padding:0;margin:0}
  .today-cal li{font-size:.88rem;color:#dce2ec;padding:2px 0 2px 16px;position:relative}
  .today-cal li:before{content:'';position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--steel)}
  .today-cal li.test:before{background:var(--amber)}
  .today-linkinline{text-transform:none;letter-spacing:0;font-weight:400}
  .today-linkinline a,.today-empty a{color:var(--steel);text-decoration:none}
  .today-empty{font-size:.88rem;color:#9fb0c6}
  .today-score-inline{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
  .today-score{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1}
  .today-score small{font-size:.8rem;color:#9fb0c6}
  .today-score.sc-green{color:#7ee0a0}.today-score.sc-amber{color:#f0c674}.today-score.sc-red{color:#e08a8a}.today-score.sc-none{color:#9fb0c6}
  /* Sticky quick-jump bar (mobile) */
  .quickbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(22,36,58,.97);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.1);display:none}
  .quickbar-inner{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;padding:6px 8px;max-width:760px;margin:0 auto}
  .quickbar-inner::-webkit-scrollbar{display:none}
  .quickbar a{flex:0 0 auto;font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:.72rem;color:#aeb9c9;text-decoration:none;padding:8px 12px;border-radius:4px;white-space:nowrap}
  .quickbar a:active,.quickbar a.qb-accent{color:#fff}
  .quickbar a.qb-accent{background:var(--green)}
  .quickbar a.qb-update{background:var(--steel);color:#fff}
  @media(max-width:820px){.quickbar{display:block} body{padding-bottom:56px}}

  /* ---------- Sections ---------- */
  section{padding:34px 0 8px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .sec-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1;letter-spacing:.01em}
  .sec-meta{font-family:'Barlow Condensed',sans-serif;font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;text-align:right}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}

  .metric{
    background:var(--card);border:1px solid var(--line);border-radius:3px;
    padding:14px 15px 15px;position:relative;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .metric:hover{border-color:#cfcdc3;box-shadow:0 1px 0 rgba(20,26,34,.04),0 6px 18px -12px rgba(20,26,34,.25)}
  .metric.untracked{opacity:.6}
  .m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .m-name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.98rem;letter-spacing:.01em;line-height:1.15}
  .m-val{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:.85;text-align:right;white-space:nowrap;font-feature-settings:"tnum"}
  .m-val small{font-size:.66rem;font-family:var(--mono);color:var(--muted);letter-spacing:0;font-weight:500}
  .m-val.empty{color:var(--track)}

  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .s-green{background:var(--green)} .s-amber{background:var(--amber)} .s-red{background:var(--red)} .s-none{background:var(--track)}

  /* sparkline */
  .spark{display:block;width:100%;height:30px;margin:12px 0 4px}

  /* pacer bar — the signature element */
  .bar{margin-top:12px}
  .bar-track{position:relative;height:6px;background:var(--track);border-radius:4px;overflow:visible}
  .bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--steel);transition:width .6s ease}
  .bar-fill.green{background:var(--green)} .bar-fill.amber{background:var(--amber)} .bar-fill.red{background:var(--red)}
  .pacer-tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.5}
  .bar-labels{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .bar-labels b{color:var(--ink);font-weight:700}

  .m-date{margin-top:9px;font-size:.62rem;color:var(--muted);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
  .m-note{margin-top:9px;font-size:.78rem;color:#5a6068;line-height:1.35;font-style:italic}
  .m-warn{margin-top:11px;padding:9px 12px;background:rgba(192,80,63,.12);border:1px solid var(--red);border-radius:3px;color:var(--red);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:.02em;line-height:1.35}
  .trend{display:inline-block;margin-top:9px;font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.02em;text-transform:uppercase}
  .m-target{margin-top:11px;font-family:var(--mono);font-size:.7rem;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
  .m-target b{color:var(--ink);font-weight:700}
  .tr-good{color:var(--green)} .tr-bad{color:var(--red)}

  /* Protocol */
  .protocol details{
    background:var(--card);border:1px solid var(--line);border-radius:3px;margin-bottom:10px;overflow:hidden;
  }
  .protocol summary{
    cursor:pointer;list-style:none;padding:13px 17px;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1.1rem;letter-spacing:.02em;
    display:flex;justify-content:space-between;align-items:center;
  }
  .protocol summary::-webkit-details-marker{display:none}
  .protocol summary::after{content:"+";font-size:1.3rem;color:var(--steel);font-weight:400}
  .protocol details[open] summary::after{content:"\2212"}
  .protocol summary:hover{background:#fafaf7}
  .protocol .body{padding:2px 17px 16px;border-top:1px solid var(--line)}
  .protocol ul{list-style:none;columns:2;column-gap:28px}
  .protocol li{padding:3px 0;font-size:.92rem;color:#3a4049;break-inside:avoid}
  .protocol li::before{content:"\2014  ";color:var(--steel)}
  .protocol .pnote{margin-top:10px;font-size:.8rem;font-style:italic;color:var(--muted)}
  @media(max-width:600px){.protocol ul{columns:1}}
  /* expandable supplement items */
  .protocol ul.supp-list{columns:1}
  .protocol .supp-item{padding:0;margin:2px 0}
  .protocol .supp-item::before{content:""}
  .supp-toggle{width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:.92rem;color:#3a4049;padding:7px 0 7px 20px;cursor:pointer;position:relative;font-weight:600}
  .supp-toggle::before{content:"\2014";color:var(--steel);position:absolute;left:0}
  .supp-toggle::after{content:"+";position:absolute;right:2px;color:var(--muted);font-family:var(--mono)}
  .supp-item.open .supp-toggle::after{content:"\2013"}
  .supp-desc{display:none;font-size:.85rem;color:var(--muted);line-height:1.45;padding:0 4px 10px 20px}
  .supp-item.open .supp-desc{display:block}

  /* status meters */
  .status-meter{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .meter-bar{flex:1;height:8px;border-radius:5px;overflow:hidden;display:flex;background:var(--track)}
  .meter-seg{height:100%}
  .meter-label{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
  .st-green{color:var(--green)} .st-amber{color:var(--amber)} .st-red{color:var(--red)} .st-none{color:var(--muted)}
  .status-meter.big .meter-bar{height:14px;border-radius:7px}
  .status-meter.big .meter-label{font-size:1.05rem}

  /* current focus */
  .focus-card{background:var(--navy);color:#fff;border-radius:4px;padding:20px 24px;margin-bottom:14px}
  .focus-tag{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;color:var(--steel);margin-bottom:6px}
  .focus-main{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1.05;letter-spacing:.01em}
  .focus-why{font-size:.9rem;color:#c7d2e0;margin-top:8px;max-width:62ch}

  /* project 50 score */
  .score-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .score-head-title{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:.01em}
  .score-overall{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;line-height:1}
  .score-overall small{font-size:1rem;color:var(--muted)}
  .score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
  .score-card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--track);border-radius:4px;padding:14px 16px;text-align:center}
  .score-val{font-family:'Bebas Neue',sans-serif;font-size:2.6rem;line-height:1}
  .score-name{font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:.92rem;margin-top:4px}
  .score-sub{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  .sc-green{border-top-color:var(--green)} .sc-green .score-val,.score-overall.sc-green{color:var(--green)}
  .sc-amber{border-top-color:var(--amber)} .sc-amber .score-val,.score-overall.sc-amber{color:var(--amber)}
  .sc-red{border-top-color:var(--red)} .sc-red .score-val,.score-overall.sc-red{color:var(--red)}
  .sc-none .score-val,.score-overall.sc-none{color:var(--muted)}

  /* wins */
  .wins-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .win{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
  .win.won{border-left:4px solid var(--green)}
  .win.locked{opacity:.55;border-left:4px solid var(--track)}
  .win-ico{font-size:1.4rem;line-height:1}
  .win-label{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1rem;letter-spacing:.01em}
  .win-sub{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

  /* publishing */
  .pub-week{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
  .pub-day{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
  .pub-long{border-top:4px solid var(--steel)} .pub-short{border-top:4px solid var(--green)}
  .pub-dayname{font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--muted)}
  .pub-show{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;line-height:1.05;margin:2px 0 6px}
  .pub-desc{font-size:.84rem;color:#4a5159;line-height:1.4}
  .pub-tie{margin-top:8px;font-size:.78rem;background:#e8eef7;color:#2c5a99;border-radius:3px;padding:5px 9px;font-weight:500}
  .pub-sub{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:8px}
  @media(max-width:640px){.pub-sub{grid-template-columns:1fr}}
  .pub-note{background:#f1f4f9;border-left:3px solid var(--steel);border-radius:3px;padding:10px 13px;font-size:.82rem;color:#46505e;line-height:1.45;margin-bottom:16px}
  .pub-model{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.04em;color:var(--steel);text-align:center;margin:4px 0 14px}
  .pub-feature{background:var(--navy);color:#eef1f6;border-radius:4px;padding:18px 20px;margin-bottom:16px}
  .pub-feature-tag{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:var(--steel);margin-bottom:4px}
  .pub-feature-title{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:.01em}
  .pub-feature-meta{font-size:.82rem;color:#c4ccd9;margin:2px 0 10px}
  .pub-feature-covers{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .pub-feature-covers span{font-size:.74rem;background:rgba(255,255,255,.1);color:#dce3ee;padding:3px 9px;border-radius:3px}
  .pub-feature-note{font-size:.82rem;color:#c4ccd9;line-height:1.45;max-width:70ch}
  .pub-block-h{font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;color:var(--muted);margin-bottom:6px}
  .pub-block ul{list-style:none;margin:0;padding:0}
  .pub-block li{font-size:.88rem;padding:3px 0 3px 14px;position:relative}
  .pub-block li:before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:var(--line)}
  .broll{display:flex;flex-wrap:wrap;gap:6px}
  .broll-tag{font-size:.78rem;background:#f1efe8;color:#5a5f66;padding:4px 10px;border-radius:3px}

  /* locations / sets */
  .loc-intro{font-size:.92rem;color:#4a5159;line-height:1.5;margin-bottom:16px;max-width:70ch}
  .loc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .loc-card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--steel);border-radius:4px;padding:16px 18px}
  .loc-verb{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;line-height:1;letter-spacing:.02em;color:var(--steel)}
  .loc-name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1.05rem;letter-spacing:.02em;margin-bottom:2px}
  .loc-purpose{font-size:.84rem;color:var(--muted);margin-bottom:10px}
  .loc-content{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .loc-content span{font-size:.74rem;background:var(--hair);color:#5a5f66;padding:3px 8px;border-radius:3px}
  .loc-style{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .loc-teach{border-top-color:#4a7ec7} .loc-teach .loc-verb{color:#4a7ec7}
  .loc-test{border-top-color:#3f8f5b} .loc-test .loc-verb{color:#3f8f5b}
  .loc-recover{border-top-color:#3aa6b9} .loc-recover .loc-verb{color:#3aa6b9}
  .loc-perform{border-top-color:#c0503f} .loc-perform .loc-verb{color:#c0503f}
  .loc-reflect{border-top-color:#6a4a99} .loc-reflect .loc-verb{color:#6a4a99}
  .loc-explore{border-top-color:#c89031} .loc-explore .loc-verb{color:#c89031}
  .loc-think{border-top-color:#7a828c} .loc-think .loc-verb{color:#7a828c}
  .loc-endure{border-top-color:#9a5b2c} .loc-endure .loc-verb{color:#9a5b2c}
  .loc-fuel{border-top-color:#5a8f3f} .loc-fuel .loc-verb{color:#5a8f3f}
  .loc-adventure{border-top-color:#b8472d} .loc-adventure .loc-verb{color:#b8472d}
  .loc-cardtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .loc-tier{font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.64rem;padding:3px 8px;border-radius:3px;white-space:nowrap;margin-top:4px}
  .tier-anchor{background:#16243a;color:#fff}
  .tier-regular{background:var(--hair);color:#5a5f66}
  .tier-event{background:#f3ead9;color:#9a6a1f}

  /* calendar */
  .cal-list{display:flex;flex-direction:column;gap:10px}
  .cal-month{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
  .cal-month.cal-now{border:2px solid var(--steel)}
  .cal-month-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}

  .cal-broll-count{font-family:var(--mono);font-size:.68rem;background:var(--hair);color:var(--muted);padding:1px 7px;border-radius:3px}
  .cal-broll ul{list-style:none;margin:10px 0 0;padding:0;columns:2;column-gap:18px}

  .cal-broll li:before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:2px;background:var(--amber);opacity:.6}
  /* checkable items */
  .ck-list{list-style:none;margin:0;padding:0}
  .cal-broll .ck-list{columns:2;column-gap:18px}
  @media(max-width:640px){.cal-broll .ck-list{columns:1}}
  li.ck-item{display:flex;align-items:flex-start;gap:9px;padding:5px 0;cursor:pointer;line-height:1.35;break-inside:avoid;-webkit-tap-highlight-color:transparent;user-select:none}
  li.ck-item:before{display:none}
  .ck-box{flex:0 0 auto;width:17px;height:17px;margin-top:1px;border:1.5px solid var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:#fff;background:#fff;transition:.12s}
  .ck-txt{font-size:.88rem}
  li.ck-item.ck-done .ck-box{background:var(--green);border-color:var(--green)}

  .ck-count{font-family:var(--mono);font-size:.68rem;background:var(--hair);color:var(--muted);padding:1px 7px;border-radius:3px;margin-left:6px}
  /* content bank */

  .gauge-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px 24px;margin-bottom:8px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  /* ---------- Routine modal ---------- */
  .today-recovery-link{color:#cfe0f5;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;cursor:pointer}

  .routine-modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.4rem;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px}
  .routine-modal-close:hover{color:var(--ink)}
  .routine-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;border-bottom:2px solid var(--navy);padding-bottom:5px;margin-bottom:2px}
  .routine-name{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.01em;color:var(--navy)}
  .routine-meta{font-family:'Barlow Condensed',sans-serif;font-size:.8rem;color:var(--steel);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .routine-when{font-size:.84rem;color:var(--muted);font-style:italic;margin:6px 0 12px;line-height:1.4}
  .routine-table{width:100%;border-collapse:collapse;font-size:.85rem}
  .routine-table th{text-align:left;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:.7rem;color:var(--muted);padding:5px 8px;border-bottom:1px solid var(--line)}
  .routine-table td{padding:7px 8px;border-bottom:1px solid var(--hair);vertical-align:top}
  .routine-table td:first-child{font-family:var(--mono);font-size:.78rem;color:var(--steel);width:26px}
  .routine-table .move{font-weight:600;color:var(--ink)}
  .routine-table .dur{font-family:var(--mono);font-size:.78rem;white-space:nowrap;color:var(--navy)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="eyebrow">The 50-Year Athlete Project</div>
    <h1 id="hTitle">Project 50</h1>
    <div class="sub" id="hSub">Loading…</div>
    <div class="hero-stats" id="heroStats"></div>
  </div>
</header>

<nav><div class="wrap"><div class="navrow" id="navrow"></div></div></nav>

<main class="wrap" id="main"><p style="padding:40px 0;color:var(--muted)">Loading dashboard…</p></main>

<footer><div class="wrap">Functional Core Fitness · Coach Omar Lima · Edit data.json to log progress</div></footer>
<div class="quickbar"><div class="quickbar-inner" id="quickbar"></div></div>

<script>
const DAY = 86400000;

const ROUTINES=[
  {
    key:"Power Plate",
    name:"Power Plate", meta:"~12 min", when:"Post-strength recovery — Friday. Keep the muscle relaxed and let the vibration do the work; you're not holding tension. Stop if you feel numbness or tingling.",
    cols:["Position","What to do","Duration","Setting"],
    moves:[
      ["Quad / IT band","Kneel with one thigh on the plate, forearms on the floor, roll the thigh slowly along the plate","60s / leg","30 Hz · Low"],
      ["Calf","Seated on floor, one calf resting on the plate, hands supporting hips, shift slightly to find tight spots","60s / leg","30 Hz · Low"],
      ["Glute","Sit on the plate, cross one ankle over the opposite knee, lean into the glute","60s / side","35 Hz · Low"],
      ["Hamstring","Seated on floor, hamstrings on the plate edge, lean back on your hands","90s","30 Hz · Low"],
      ["Standing decompression","Stand tall on the plate, soft knees, arms relaxed, breathe slow","90s","40 Hz · Med"],
    ]
  },
  {
    key:"Stick Mobility",
    name:"Stick Mobility Flow", meta:"~15 min", when:"Post-BJJ — Mon / Wed. Create tension against the stick (isometric pull or push) to unlock deeper range; that's what separates it from a plain stretch.",
    cols:["Movement","What to do","Reps / Hold"],
    moves:[
      ["Overhead pull-apart","Stick overhead with an active outward pull, open the chest","8 slow reps"],
      ["Shoulder pass-through","Wide grip, take the stick from front to behind you with control","6 reps"],
      ["Hip 90/90 with stick","Stick vertical for support, rotate between 90/90 sides","5 / side"],
      ["Deep squat pry","Stick planted in front, pull yourself down into a squat, pry knees out","60s hold"],
      ["Cossack shift","Stick for support, shift side to side in a wide stance","5 / side"],
      ["T-spine rotation","Half-kneel, stick behind the shoulders, rotate open","6 / side"],
    ]
  },
  {
    key:"RAD",
    name:"RAD Massage Balls", meta:"5–10 min", when:"Pair with mobility-flow days (Mon / Wed / Thu). Use the Supernova for large muscles, the Battlestar (roller) for long lines like calves and forearms, and the smaller balls for pinpoint spots. Breathe into tender areas; don't grind through sharp pain.",
    cols:["Target","Tool + what to do","Duration"],
    moves:[
      ["Foot / plantar","Supernova or small ball underfoot, roll heel-to-toe, pause on tight knots","45s / foot"],
      ["Calves","Battlestar roller under calf, slow passes, rotate leg in and out","60s / leg"],
      ["Glutes / piriformis","Sit on Supernova, cross ankle over knee, hunt for the tight spot and hold","60s / side"],
      ["T-spine","Lie on two balls either side of the spine, arms crossed, slow extensions","60s"],
      ["Lats","Side-lying, Supernova under the armpit/lat, small rolls","45s / side"],
      ["Forearms","Battlestar on a table, roll forearm across it (BJJ grip recovery)","45s / arm"],
    ]
  },
  {
    key:"Normatec",
    name:"Normatec Boots", meta:"20–30 min", when:"After BJJ (Thu) and long runs (Sun). Legs plus the hip attachment. Lie down, elevate slightly, let it run a full cycle. Great time to stack with Wim Hof breathing.",
    cols:["Setup","What to do","Duration","Setting"],
    moves:[
      ["Full leg + hip","Zip into both boots and the hip attachment, lie down flat, elevate feet slightly on a pillow","20–30 min","Level 4–6"],
      ["Breathing pairing","Run Wim Hof rounds during the cycle — hands free, nothing else to do","first 10 min","—"],
      ["Pressure","Start mid-level; increase only if it stays comfortable, never to the point of numbness","whole session","adjust to feel"],
    ]
  },
  {
    key:"Venom",
    name:"Venom Wraps", meta:"~15 min each", when:"Heat + vibration for post-strength or post-long-run tightness — Saturday recovery block. Back/shoulder wrap and lower-back band. Warm up first (heat), then let vibration work.",
    cols:["Wrap","Placement + what to do","Duration","Mode"],
    moves:[
      ["Back / shoulder","Secure over the upper back and shoulder, sit or lie back, relax the area fully","15 min","Heat → Vibration"],
      ["Lower-back band","Wrap around the lower back / waist, snug but not tight, stay still","15 min","Heat → Vibration"],
      ["Sequence","Let heat build for the first few minutes, then add vibration for the remainder","per wrap","warm first"],
    ]
  },
  {
    key:"NeoCarbon",
    name:"NeoCarbon EMS", meta:"20–30 min", when:"3×/week, recovery mode. Target the muscles you trained that day (legs Tue, upper Fri). Place pads on the muscle belly, not on joints or the spine. Recovery mode = low, comfortable pulsing, not a hard contraction.",
    cols:["Target day","Pad placement","Duration","Mode"],
    moves:[
      ["Legs (Tue)","Quads and/or calves — pads on the muscle belly, red remote","20–30 min","Recovery / low"],
      ["Upper (Fri)","Upper back or shoulders — avoid the spine and the front of the neck","20–30 min","Recovery / low"],
      ["Intensity","Turn up only to a comfortable tingling pulse; back off if it locks the muscle hard","whole session","adjust to feel"],
    ]
  },
];
const DUR_COLS=["Duration","Reps / Hold","Setting","Mode"];

function linkifyRecovery(text){
  if(!text) return text;
  return text.split(' + ').map(seg=>{
    const hit = ROUTINES.find(r=>seg.indexOf(r.key)!==-1);
    if(hit){
      return seg.replace(hit.key, `<span class="today-recovery-link" onclick="openRoutine('${hit.key}')">${hit.key}</span>`);
    }
    return seg;
  }).join(' + ');
}

function openRoutine(key){
  const r = ROUTINES.find(x=>x.key===key);
  if(!r) return;
  const head=`<div class="routine-head"><span class="routine-name">${r.name}</span><span class="routine-meta">${r.meta}</span></div>`;
  const when=`<div class="routine-when">${r.when}</div>`;
  const th=r.cols.map(c=>`<th>${c}</th>`).join('');
  const rows=r.moves.map((m,i)=>{
    let tds=`<td>${i+1}</td>`;
    m.forEach((cell,ci)=>{
      const colName=r.cols[ci];
      if(ci===0) tds+=`<td class="move">${cell}</td>`;
      else if(DUR_COLS.includes(colName)) tds+=`<td class="dur">${cell}</td>`;
      else tds+=`<td>${cell}</td>`;
    });
    return `<tr>${tds}</tr>`;
  }).join('');
  const table=`<table class="routine-table"><tr><th></th>${th}</tr>${rows}</table>`;
  document.getElementById('routineModal').innerHTML =
    `<button class="routine-modal-close" onclick="closeRoutine()">&times;</button>${head}${when}${table}`;
  document.getElementById('routineOverlay').classList.add('open');
}
function closeRoutine(){
  document.getElementById('routineOverlay').classList.remove('open');
}

function fmt(v){
  if(v===null||v===undefined) return null;
  if(Number.isInteger(v)) return v.toLocaleString();
  return (Math.round(v*100)/100).toLocaleString();
}
function daysUntil(dateStr){
  const now=new Date(); const t=new Date(dateStr+"T00:00:00");
  return Math.max(0, Math.round((t-now)/DAY));
}
function ageOn(birthday, ref){
  const b=new Date(birthday), r=new Date(ref);
  let a=r.getFullYear()-b.getFullYear();
  const m=r.getMonth()-b.getMonth();
  if(m<0||(m===0&&r.getDate()<b.getDate())) a--;
  return a;
}
function nextBirthdayAt(birthday, targetAge){
  const b=new Date(birthday);
  return new Date(b.getFullYear()+targetAge, b.getMonth(), b.getDate());
}

// status + progress relative to pacer/goal
function evaluate(m){
  if(m.value===null||m.value===undefined) return {status:"none", pct:0, pacerPct:null};
  const dir=m.direction;
  if(dir==="neutral"||m.goal===null||m.goal===undefined){
    return {status:"tracked", pct:0, pacerPct:null, flat:true};
  }
  // We need a baseline-to-goal span. Use pacer as the racing line.
  // status: compare value to pacer
  let status="red";
  if(m.pacer!==null&&m.pacer!==undefined){
    const meets = dir==="up" ? m.value>=m.pacer : m.value<=m.pacer;
    const within = dir==="up" ? m.value>=m.pacer*0.9 : m.value<=m.pacer*1.1;
    status = meets ? "green" : (within ? "amber" : "red");
  } else status="tracked";

  // progress fill: position of value between a soft baseline and goal
  // baseline = pacer pulled back toward start so the bar has room
  let lo, hi;
  if(dir==="down"){ hi = m.pacer ?? m.value; lo = m.goal; }
  else { lo = m.pacer ? Math.min(m.pacer, m.value) : m.value; hi = m.goal; }
  // generic span: from a reasonable floor to the goal
  let pct, pacerPct=null;
  if(dir==="up"){
    const floor = Math.min(m.value, m.pacer ?? m.value) * 0.85;
    const span = m.goal - floor;
    pct = span>0 ? (m.value-floor)/span*100 : 100;
    if(m.pacer!=null) pacerPct=(m.pacer-floor)/span*100;
  } else {
    const ceil = Math.max(m.value, m.pacer ?? m.value) * 1.08;
    const span = ceil - m.goal;
    pct = span>0 ? (ceil-m.value)/span*100 : 100;
    if(m.pacer!=null) pacerPct=(ceil-m.pacer)/span*100;
  }
  pct=Math.max(3,Math.min(100,pct));
  if(pacerPct!=null) pacerPct=Math.max(0,Math.min(100,pacerPct));
  return {status, pct, pacerPct};
}

function sparkline(m){
  if(!m.history || !m.history.length || m.value==null) return "";
  // build series: history values (oldest->newest) then current
  const pts = [...m.history.map(h=>h.value), m.value].filter(v=>v!=null);
  if(pts.length<2) return "";
  const w=120, h=30, pad=3;
  const min=Math.min(...pts), max=Math.max(...pts);
  const range=(max-min)||1;
  const x=i=> pad + i*(w-2*pad)/(pts.length-1);
  const y=v=> h-pad - ((v-min)/range)*(h-2*pad);
  const dPath = pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  // color by whether the latest move is improving
  const last=pts[pts.length-1], prev=pts[pts.length-2];
  let stroke='var(--steel)';
  if(m.direction==='up') stroke = last>=prev ? 'var(--green)':'var(--red)';
  else if(m.direction==='down') stroke = last<=prev ? 'var(--green)':'var(--red)';
  const cx=x(pts.length-1), cy=y(last);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${dPath}" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="2.4" fill="${stroke}"/>
  </svg>`;
}

function metricCard(m){
  const ev=evaluate(m);
  const untracked = m.value===null||m.value===undefined;
  const sClass = {green:"s-green",amber:"s-amber",red:"s-red"}[ev.status]||"s-none";
  const valHtml = untracked
    ? `<div class="m-val empty">—</div>`
    : `<div class="m-val">${fmt(m.value)}${m.unit?`<small> ${m.unit}</small>`:""}</div>`;

  let barHtml="";
  if(!untracked && !ev.flat && m.goal!=null){
    const fillClass = ev.status==="green"?"green":ev.status==="amber"?"amber":ev.status==="red"?"red":"";
    const tick = ev.pacerPct!=null ? `<div class="pacer-tick" style="left:${ev.pacerPct}%"></div>`:"";
    barHtml=`
      <div class="bar">
        <div class="bar-track">
          <div class="bar-fill ${fillClass}" style="width:${ev.pct}%"></div>
          ${tick}
        </div>
        <div class="bar-labels">
          <span>Now <b>${fmt(m.value)}</b></span>
          ${m.pacer!=null?`<span>Pacer ${fmt(m.pacer)}</span>`:""}
          <span>Goal <b>${fmt(m.goal)}</b></span>
        </div>
      </div>`;
  } else if(!untracked && m.goal!=null && ev.flat){
    barHtml=`<div class="m-date">Goal ${fmt(m.goal)} ${m.unit}</div>`;
  } else if(!untracked && m.goal!=null){
    barHtml=`<div class="bar"><div class="bar-labels"><span>Now <b>${fmt(m.value)}</b></span><span>Goal <b>${fmt(m.goal)}</b></span></div></div>`;
  }

  const dateHtml = m.date ? `<div class="m-date">Logged ${m.date}</div>`
                          : (untracked?`<div class="m-date">Not yet tested</div>`:"");

  // show the target even before testing
  let targetHtml = "";
  if(untracked && (m.pacer!=null || m.goal!=null)){
    const bits=[];
    if(m.pacer!=null) bits.push(`Pacer <b>${fmt(m.pacer)}</b>`);
    if(m.goal!=null) bits.push(`Goal <b>${fmt(m.goal)}</b>`);
    targetHtml = `<div class="m-target">${bits.join(" \u00b7 ")}${m.unit?` ${m.unit}`:""}</div>`;
  }
  const noteHtml = m.note ? `<div class="m-note">${m.note}</div>` : "";

  // active warning: when a metric tagged with 'warnOver' exceeds that value
  let warnHtml = "";
  if(!untracked && m.warnOver!=null && m.value > m.warnOver){
    warnHtml = `<div class="m-warn">\u26a0 ${m.warnLabel || 'Above threshold'} \u2014 value ${fmt(m.value)} exceeds ${fmt(m.warnOver)}. Check for a developing limp or compensation.</div>`;
  }

  // trend vs most recent history entry
  let trendHtml = "";
  if(!untracked && m.history && m.history.length){
    const prev = m.history[m.history.length-1];
    if(prev && prev.value!=null){
      const delta = Math.round((m.value - prev.value)*100)/100;
      if(delta!==0){
        const improving = m.direction==="up" ? delta>0 : delta<0;
        const arrow = delta>0 ? "\u2191" : "\u2193";
        const cls = improving ? "tr-good" : "tr-bad";
        trendHtml = `<span class="trend ${cls}">${arrow} ${Math.abs(delta)} since ${prev.date}</span>`;
      }
    }
  }

  const sparkHtml = sparkline(m);

  return `<div class="metric ${untracked?'untracked':''}">
    <div class="m-top">
      <div class="m-name"><span class="dot ${sClass}"></span>${m.name}</div>
      ${valHtml}
    </div>
    ${sparkHtml}
    ${barHtml}
    ${warnHtml}
    ${targetHtml}
    ${trendHtml}
    ${noteHtml}
    ${dateHtml}
  </div>`;
}

function render(d){

  document.getElementById('navrow').innerHTML =

    (d.publishing?`<a href="#publishing">Publishing</a>`:'') +
    (d.calendar?`<a href="#calendar">Calendar</a>`:'') +
    (d.content_bank?`<a href="#contentbank">Content Bank</a>`:'') +
    (d.locations?`<a href="#locations">Sets</a>`:'') +
    (d.wins?`<a href="#wins">Wins</a>`:'') +
    (d.protocol?`<a href="#protocol">Protocol</a>`:'') +
    `<a href="workout.html" class="nav-workout">Workout</a>` +
    `<a href="update.html" class="nav-update">Update</a>`;

  // sticky quick-jump bar (mobile) — the high-frequency destinations
  document.getElementById('quickbar').innerHTML =
    `<a href="#today" class="qb-accent">Today</a>` +
    `<a href="#calendar">Calendar</a>` +
    `<a href="#p50-score">Score</a>` +
    `<a href="workout.html">Log</a>` +
    `<a href="update.html" class="qb-update">Update</a>`;

  // episode export block
  const exItems=[
    {k:'Age',v:curAge},
    {k:'Phase',v:a.current_phase},
    {k:'Weight',v:fmt(wt?.value),u:'lb'},
    {k:'DEXA BF',v:fmt(bf?.value),u:'%'},
    {k:'Lean Mass',v:fmt(lean?.value),u:'lb'},
    {k:'VO₂ Max',v:fmt(vo2?.value)},
    {k:'HRV',v:fmt(hrv?.value),u:'ms'},
    {k:'Resting HR',v:fmt(rhr?.value),u:'bpm'},
    {k:'Race Target',v:a.current_race_target},
    {k:'Days to 50',v:dLeft.toLocaleString()},
  ];
  let html = `
    <section id="export">
      <div class="export-card">
        <div class="eyebrow">Episode Dashboard · ${fiftyStr.slice(0,4)} build</div>
        <h2>Where I Stand Today</h2>
        <div class="ex-grid">
          ${exItems.map(e=>`<div class="ex-item${e.k==='Race Target'?' wide':''}"><div class="k">${e.k}</div><div class="v">${e.v??'—'}${e.u?` <small>${e.u}</small>`:''}</div></div>`).join('')}
        </div>
      </div>
    </section>`;

  // count statuses across a set of metrics for the status meter
  function sectionStatus(metrics, isLabs){
    let green=0, amber=0, red=0, untested=0;
    for(const m of metrics){
      if(m.value===null||m.value===undefined){ untested++; continue; }
      if(isLabs){
        if(m.flag==='out') red++; else green++;
        continue;
      }
      const ev=evaluate(m);
      if(ev.status==='green') green++;
      else if(ev.status==='amber') amber++;
      else if(ev.status==='red') red++;
      else green++; // flat/tracked-with-no-target counts as ok
    }
    const tested=green+amber+red;
    return {green,amber,red,untested,tested};
  }

  // build a compact status meter (segmented bar + label)
  function statusMeter(s, opts={}){
    const total=s.tested||1;
    const gPct=s.green/total*100, aPct=s.amber/total*100, rPct=s.red/total*100;
    let label, lclass;
    if(s.tested===0){ label='Not yet tested'; lclass='st-none'; }
    else if(s.red>0){ label=`${s.red} need attention`; lclass='st-red'; }
    else if(s.amber>0){ label=`${s.amber} near target`; lclass='st-amber'; }
    else { label='All on track'; lclass='st-green'; }
    const seg = s.tested===0
      ? `<div class="meter-seg" style="width:100%;background:var(--track)"></div>`
      : `<div class="meter-seg" style="width:${gPct}%;background:var(--green)"></div>
         <div class="meter-seg" style="width:${aPct}%;background:var(--amber)"></div>
         <div class="meter-seg" style="width:${rPct}%;background:var(--red)"></div>`;
    return `<div class="status-meter ${opts.big?'big':''}">
      <div class="meter-bar">${seg}</div>
      <div class="meter-label ${lclass}">${label}</div>
    </div>`;
  }

  // category sections
  for(const c of d.categories){
    const isLabs = c.id==='labs';

    // Labs: show only out-of-range markers; goal is zero out of range
    let metricsToShow = c.metrics;
    let metaHtml = `${c.source}<br>${c.cadence}`;
    let labsNote = '';
    if(isLabs){
      const outList = c.metrics.filter(m=>m.flag==='out');
      const tested = c.metrics.filter(m=>m.value!==null && m.value!==undefined).length;
      metricsToShow = outList;
      const n = outList.length;
      const counterClass = n===0 ? 'goal-met' : 'goal-open';
      metaHtml = `${c.source}<br>
        <span class="labs-goal ${counterClass}">
          ${n===0 ? 'All markers in range \u2713' : `${n} out of range \u00b7 goal 0`}
        </span>`;
      labsNote = `<div class="labs-note"><b>Showing out-of-range markers only.</b> ${tested} markers tracked; the rest are in healthy range. Goal: zero out of range. Thyroid history on file: 7.7 cm right nodule, multinodular enlargement, cancer ruled out.</div>`;
    }

    const gridInner = metricsToShow.length
      ? metricsToShow.map(metricCard).join('')
      : `<div class="all-clear">Every tracked marker is in healthy range. Goal met.</div>`;

    const sStat = sectionStatus(c.metrics, isLabs);
    html += `
      <section id="${c.id}">
        <div class="sec-head">
          <div class="sec-title">${c.name}</div>
          <div class="sec-meta">${metaHtml}</div>
        </div>
        ${statusMeter(sStat)}
        ${labsNote}
        <div class="grid">
          ${gridInner}
        </div>
      </section>`;
  }
  // protocol section
  if(d.protocol){
    html += `
      <section id="protocol" class="protocol">
        <div class="sec-head">
          <div class="sec-title">Protocol &amp; Context</div>
          <div class="sec-meta">Reference<br>Tap to expand</div>
        </div>`;
    if(d.protocol.thyroid_history){
      html += `<div class="labs-note"><b>Thyroid history:</b> ${d.protocol.thyroid_history}</div>`;
    }
    for(const g of d.protocol.groups){
      const hasDesc = g.items.some(i=>typeof i==='object' && i.purpose);
      const itemsHtml = g.items.map(i=>{
        if(typeof i==='object' && i.purpose){
          return `<li class="supp-item"><button class="supp-toggle" type="button">${i.name}</button><div class="supp-desc">${i.purpose}</div></li>`;
        }
        const label = (typeof i==='object') ? i.name : i;
        return `<li>${label}</li>`;
      }).join('');
      html += `
        <details>
          <summary>${g.title}</summary>
          <div class="body">
            <ul class="${hasDesc?'supp-list':''}">${itemsHtml}</ul>
            ${g.note?`<div class="pnote">${g.note}</div>`:''}
          </div>
        </details>`;
    }
    html += `</section>`;
  }

  // overall health gauge across all categories
  let allG=0,allA=0,allR=0,allU=0;
  for(const c of d.categories){
    const s=sectionStatus(c.metrics, c.id==='labs');
    allG+=s.green; allA+=s.amber; allR+=s.red; allU+=s.untested;
  }
  const overall={green:allG,amber:allA,red:allR,untested:allU,tested:allG+allA+allR};
  const overallLabel = overall.red>0
    ? `${overall.red} marker${overall.red>1?'s':''} need attention`
    : overall.amber>0 ? `${overall.amber} near target` : 'All systems on track';
  const gaugeHtml = `
    <section id="health-gauge">
      <div class="gauge-card">
        <div class="gauge-head">
          <div class="gauge-title">Overall Status</div>
          <div class="gauge-counts">
            <span class="gc gc-g"><b>${overall.green}</b> on track</span>
            <span class="gc gc-a"><b>${overall.amber}</b> near</span>
            <span class="gc gc-r"><b>${overall.red}</b> attention</span>
            <span class="gc gc-n"><b>${overall.untested}</b> untested</span>
          </div>
        </div>
        ${statusMeter(overall,{big:true})}
      </div>
    </section>`;

  // ---- Project 50 Score: 0-100 per group ----
  function scoreFor(catIds){
    let g=0,a=0,r=0,t=0;
    for(const id of catIds){
      const c=d.categories.find(x=>x.id===id); if(!c) continue;
      const s=sectionStatus(c.metrics, id==='labs');
      g+=s.green; a+=s.amber; r+=s.red; t+=s.tested;
    }
    if(t===0) return {score:null, tested:0};
    const score=Math.round(((g*1 + a*0.6 + r*0.2)/t)*100);
    return {score, tested:t};
  }
  function scoreClass(sc){
    if(sc===null) return 'sc-none';
    if(sc>=80) return 'sc-green';
    if(sc>=60) return 'sc-amber';
    return 'sc-red';
  }
  let scoreCardsHtml='', scoreSum=0, scoreCount=0;
  for(const grp of (d.score_groups||[])){
    const {score,tested}=scoreFor(grp.categories);
    if(score!==null){ scoreSum+=score; scoreCount++; }
    scoreCardsHtml += `
      <div class="score-card ${scoreClass(score)}">
        <div class="score-val">${score===null?'\u2014':score}</div>
        <div class="score-name">${grp.name}</div>
        <div class="score-sub">${tested===0?'not yet tested':`${tested} tracked`}</div>
      </div>`;
  }
  const project50 = scoreCount? Math.round(scoreSum/scoreCount) : null;
  const scoreBlockHtml = `
    <section id="p50-score">
      <div class="score-head">
        <div class="score-head-title">Project 50 Score</div>
        <div class="score-overall ${scoreClass(project50)}">${project50===null?'\u2014':project50}<small>/100</small></div>
      </div>
      <div class="score-grid">${scoreCardsHtml}</div>
    </section>`;

  // ---- Current Focus ----
  const cf=d.current_focus;
  const focusHtml = cf ? `
    <section id="focus">
      <div class="focus-card">
        <div class="focus-tag">Current Focus \u00b7 ${cf.month}${cf.pillar?` \u00b7 ${cf.pillar}`:''}</div>
        <div class="focus-main">${cf.focus}</div>
        ${cf.why?`<div class="focus-why">${cf.why}</div>`:''}
      </div>
    </section>` : '';

  // ---- Wins ----
  const wins=d.wins||[];
  const winsHtml = wins.length ? `
    <section id="wins">
      <div class="sec-head"><div class="sec-title">Wins</div>
        <div class="sec-meta">${wins.filter(w=>w.achieved).length} of ${wins.length} unlocked</div></div>
      <div class="wins-grid">
        ${wins.map(w=>`
          <div class="win ${w.achieved?'won':'locked'}">
            <div class="win-ico">${w.achieved?'\u{1F3C6}':'\u25CB'}</div>
            <div class="win-body">
              <div class="win-label">${w.label}</div>
              <div class="win-sub">${w.achieved?(w.date||'Achieved'):'Goal'}</div>
            </div>
          </div>`).join('')}
      </div>
    </section>` : '';

  // ---- Locations / Sets ----
  const loc=d.locations;
  const locHtml = loc ? `
    <section id="locations">
      <div class="sec-head"><div class="sec-title">Sets</div>
        <div class="sec-meta">Nine zones \u00b7 nine chapters</div></div>
      <div class="loc-intro">${loc.intro}</div>
      <div class="loc-grid">
        ${loc.sets.map(s=>`
          <div class="loc-card loc-${s.key}">
            <div class="loc-cardtop">
              <div class="loc-verb">${s.verb}</div>
              ${s.tier?`<span class="loc-tier tier-${s.tier.toLowerCase()}">${s.tier}</span>`:''}
            </div>
            <div class="loc-name">${s.name}</div>
            <div class="loc-purpose">${s.purpose}</div>
            <div class="loc-content">${s.content.map(c=>`<span>${c}</span>`).join('')}</div>
            <div class="loc-style">${s.style}</div>
          </div>`).join('')}
      </div>
    </section>` : '';

  // ---- Publishing: weekly template + monthly output ----
  const pub=d.publishing;
  let pubHtml='';
  if(pub){
    // Month-aware overrides: pull this month's Coach's Corner topic + Sunday content from the calendar
    let pubM=null;
    if(d.calendar && Array.isArray(d.calendar.months)){
      const nowTag=new Date().toLocaleString('en-US',{month:'short',year:'numeric'});
      pubM=(d.calendar.months.find(m=>m.month===nowTag)||{}).pub_monthly||null;
    }
    const dayCard=(w)=>{
      let show=w.show, desc=w.desc, tie='';
      // Coach's Corner: monthly topic overrides the Current-Focus tie
      if(w.show==="Coach's Corner"){
        if(pubM && pubM.coaches_corner){ tie=`<div class="pub-tie">This month: ${pubM.coaches_corner}</div>`; }

      if(w.day==="Sunday" && pubM && pubM.sunday){

    pubHtml = `

          <div class="pub-feature-title">\u{1F3AC} ${pub.monthly_feature.title}</div>
          <div class="pub-feature-meta">${pub.monthly_feature.length} \u00b7 ${pub.monthly_feature.cadence}</div>
          <div class="pub-feature-covers">${pub.monthly_feature.covers.map(c=>`<span>${c}</span>`).join('')}</div>
          <div class="pub-feature-note">${pub.monthly_feature.note}</div>
        </div>`:''}
      <div class="pub-sub">
        <div class="pub-block">
          <div class="pub-block-h">Always collect B-roll</div>
          <div class="broll">${pub.broll.map(b=>`<span class="broll-tag">${b}</span>`).join('')}</div>
        </div>
      </div>
    </section>`;
  }

  // ---- Calendar: combined content + assessment timeline ----
  const cal=d.calendar;
  const pillarClass={"Foundation":"pl-foundation","Strength":"pl-strength","Mobility":"pl-mobility","Longevity":"pl-longevity"};
  const curMonthStr = new Date().toLocaleString('en-US',{month:'short',year:'numeric'});
  const calHtml = cal ? `
    <section id="calendar">
      <div class="sec-head"><div class="sec-title">Calendar</div>
        <div class="sec-meta">${cal.season}<br>Tests feed the episodes</div></div>
      <div class="cal-list">
        ${cal.months.map(m=>{
          const isNow = m.month===curMonthStr;
          // checkable item: stable key = month|type|index, state from localStorage
          const ckey=(type,i)=>`p50check::${m.month}::${type}::${i}`;
          const ckItem=(txt,type,i)=>{
            const done = localStorage.getItem(ckey(type,i))==='1';
            return `<li class="ck-item ${done?'ck-done':''}" data-ckey="${ckey(type,i)}">
              <span class="ck-box">${done?'\u2713':''}</span><span class="ck-txt">${txt}</span></li>`;
          };
          const countDone=(type,arr)=>arr.reduce((n,_,i)=>n+(localStorage.getItem(ckey(type,i))==='1'?1:0),0);
          const aDone=countDone('assess',m.assessments||[]);
          const bDone=m.broll?countDone('broll',m.broll):0;
          return `
          <div class="cal-month ${isNow?'cal-now':''}">
            <div class="cal-month-head">
              <div class="cal-mname">${m.month}${isNow?' <span class="cal-nowtag">This month</span>':''}</div>
              <div class="cal-pillar ${pillarClass[m.pillar]||''}">${m.pillar}</div>
            </div>
            <div class="cal-cols">
              <div class="cal-col">
                <div class="cal-col-h"><i class="dot-film"></i>Episodes</div>
                <ul>${m.episodes.map(e=>`<li>${e}</li>`).join('')}</ul>
              </div>
              <div class="cal-col">
                <div class="cal-col-h"><i class="dot-test"></i>Assessments <span class="ck-count" data-count-type="assess" data-count-month="${m.month}">${aDone}/${(m.assessments||[]).length}</span></div>
                <ul class="ck-list">${(m.assessments||[]).map((a,i)=>ckItem(a,'assess',i)).join('')}</ul>
              </div>
            </div>
            ${(m.broll && m.broll.length) ? `
            <details class="cal-broll">
              <summary><i class="dot-broll"></i>B-roll shot list <span class="cal-broll-count ck-count" data-count-type="broll" data-count-month="${m.month}">${bDone}/${m.broll.length}</span></summary>
              <ul class="ck-list">${m.broll.map((b,i)=>ckItem(b,'broll',i)).join('')}</ul>
            </details>` : ''}
          </div>`;
        }).join('')}
      </div>
    </section>` : '';

  // ===== CONTENT BANK (series curriculum + topic banks, checkable) =====
  const cb=d.content_bank;
  let cbHtml='';
  if(cb){
    const cbKey=(scope,i)=>`p50cb::${scope}::${i}`;
    const cbItem=(txt,scope,i)=>{
      const done=localStorage.getItem(cbKey(scope,i))==='1';
      return `<li class="ck-item ${done?'ck-done':''}" data-ckey="${cbKey(scope,i)}">
        <span class="ck-box">${done?'\u2713':''}</span><span class="ck-txt">${txt}</span></li>`;
    };
    // series: flat index across all tiers so keys stay stable
    const seriesBlocks=(cb.series||[]).map(s=>{
      let idx=0, done=0, total=0;
      const scope='series::'+s.title;
      const tiersHtml=(s.tiers||[]).map(t=>{
        const rows=t.items.map(it=>{ const html=cbItem(it,scope,idx); if(localStorage.getItem(cbKey(scope,idx))==='1')done++; total++; idx++; return html; }).join('');
        return `<div class="cb-tier"><div class="cb-tier-h">${t.tier}</div><ul class="ck-list">${rows}</ul></div>`;
      }).join('');
      return `<details class="cb-block" open>
        <summary><i class="dot-film"></i>${s.title} <span class="ck-count" data-cb-scope="${scope}">${done}/${total}</span></summary>
        <div class="cb-sub">${s.subtitle||''}</div>
        ${tiersHtml}
      </details>`;
    }).join('');
    // banks: simple checkable lists
    const bankBlocks=(cb.banks||[]).map(b=>{
      const scope='bank::'+b.title;
      let done=0;
      const rows=b.items.map((it,i)=>{ if(localStorage.getItem(cbKey(scope,i))==='1')done++; return cbItem(it,scope,i); }).join('');
      return `<details class="cb-block">
        <summary><i class="dot-broll"></i>${b.title} <span class="ck-count" data-cb-scope="${scope}">${done}/${b.items.length}</span></summary>
        <div class="cb-sub">${b.subtitle||''}</div>
        <ul class="ck-list">${rows}</ul>
      </details>`;
    }).join('');
    cbHtml=`
    <section id="contentbank">
      <div class="sec-head"><div class="sec-title">Content Bank</div>
        <div class="sec-meta">Series curriculum + topic pools<br>Tap to mark filmed</div></div>
      ${seriesBlocks}${bankBlocks}
    </section>`;
  }
  const todayHtml = buildTodayCard(d, window.__LOG__, project50, scoreClass);

  document.getElementById('main').innerHTML =
    todayHtml + focusHtml + scoreBlockHtml + gaugeHtml + html + pubHtml + calHtml + cbHtml + locHtml + winsHtml;

  // ---- Checkable to-do / B-roll items (per-device, localStorage) ----
  const mainEl=document.getElementById('main');
  mainEl.addEventListener('click', (e)=>{
    // supplement expand/collapse
    const supp=e.target.closest('.supp-toggle');
    if(supp){ supp.closest('.supp-item').classList.toggle('open'); return; }
    const li=e.target.closest('li.ck-item');
    if(!li) return;
    const key=li.dataset.ckey;
    const nowDone = li.classList.toggle('ck-done');
    li.querySelector('.ck-box').textContent = nowDone ? '\u2713' : '';
    if(nowDone) localStorage.setItem(key,'1'); else localStorage.removeItem(key);
    // update the matching counter (works for calendar cols, broll, and content-bank blocks)
    const list=li.closest('.ck-list');
    if(list){
      const container=li.closest('.cal-col, .cal-broll, .cb-block');
      if(container){
        // content-bank series may have multiple ck-lists under one block; count them all
        const allItems=container.querySelectorAll('li.ck-item');
        const total=allItems.length;
        const done=container.querySelectorAll('li.ck-item.ck-done').length;
        const counter=container.querySelector('.ck-count');
        if(counter) counter.textContent=`${done}/${total}`;
      }
    }
  });
}

// ---- Today card builder ----
function buildTodayCard(d, log, project50, scoreClass){
  const now=new Date();
  const dowFull=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][now.getDay()];
  const dowKey=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][now.getDay()];
  const dateStr=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});

  // --- today's plan from training-log ---
  let planBlock='';
  if(log && Array.isArray(log.weeks)){
    // determine current program week from project_start
    const start = d.athlete && (d.athlete.program_start||d.athlete.project_start);
    let wkNum=null;
    if(start){
      const sd=new Date(start+'T00:00:00');
      const days=Math.floor((now - sd)/86400000);
      wkNum = Math.floor(days/7)+1;
    }
    // clamp to available training weeks (2..11 have day plans; else nearest)
    const trainingWeeks = log.weeks.filter(w=>w.type==='training');
    let wk = trainingWeeks.find(w=>w.week===wkNum);
    if(!wk){
      if(wkNum!==null && wkNum<2) wk=trainingWeeks[0];
      else if(wkNum!==null && wkNum>11) wk=trainingWeeks[trainingWeeks.length-1];
      else wk=trainingWeeks[0];
    }
    if(wk && wk.days && wk.days[dowKey]){
      const day=wk.days[dowKey];
      const items=(day.plan||[]).map((p,i)=>`<li${i===0?' class="lead-item"':''}>${p}</li>`).join('');
      planBlock=`
        <div class="today-block">
          <div class="today-block-h"><span class="today-pillar">${day.pillar||''}</span> Week ${wk.week} · ${day.day_full||dowFull}</div>
          <ul class="today-plan">${items}</ul>
          ${day.recovery?`<div class="today-recovery">Recovery: ${linkifyRecovery(day.recovery)}</div>`:''}
          <a class="today-cta" href="workout.html">Log this session →</a>
        </div>`;
    }
  }
  if(!planBlock){
    planBlock=`<div class="today-block"><div class="today-block-h">Today's plan</div>
      <div class="today-empty">No plan mapped for today. <a href="workout.html">Open the workout log →</a></div></div>`;
  }

  // --- next calendar item ---
  let calBlock='';
  if(d.calendar && Array.isArray(d.calendar.months)){
    const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const curTag=`${monthNames[now.getMonth()]} ${now.getFullYear()}`;
    let cm=d.calendar.months.find(m=>m.month===curTag) || d.calendar.months[0];
    if(cm){
      const eps=(cm.episodes||[]).slice(0,2).map(e=>`<li>${e}</li>`).join('');
      const tests=(cm.assessments||[]).slice(0,1).map(a=>`<li class="test">${a}</li>`).join('');
      calBlock=`
        <div class="today-block">
          <div class="today-block-h">${cm.month} · ${cm.pillar||''} <span class="today-linkinline"><a href="#calendar">full calendar →</a></span></div>
          <ul class="today-cal">${eps}${tests}</ul>
        </div>`;
    }
  }

  // --- score glance ---
  const sc = project50===null?'—':project50;
  const scoreBlock=`
    <div class="today-block today-score-inline">
      <div class="today-block-h">Project 50 Score <span class="today-linkinline"><a href="#p50-score">breakdown →</a></span></div>
      <div class="today-score ${scoreClass(project50)}">${sc}<small>/100</small></div>
    </div>`;

  return `
    <section id="today" class="today-card">
      <div class="today-head">
        <div class="today-eyebrow">Today</div>
        <div class="today-date">${dateStr}</div>
      </div>
      ${planBlock}
      ${calBlock}
      ${scoreBlock}
    </section>`;
}
</script>
<div class="routine-overlay" id="routineOverlay" onclick="if(event.target===this)closeRoutine()">
  <div class="routine-modal" id="routineModal"></div>
</div>
